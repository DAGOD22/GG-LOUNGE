<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Lane Guard</title>
<style>
  html,body{margin:0;height:100%;background:#07090e;overflow:hidden;
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#e8edf4;
    -webkit-tap-highlight-color:transparent}
  #stage{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
  .hud{position:fixed;left:14px;top:12px;pointer-events:none;font:800 12px/1.4 ui-monospace,SFMono-Regular,monospace;
    letter-spacing:.08em;color:#bef264;text-shadow:0 2px 14px rgba(0,0,0,.7)}
  .hud small{display:block;font-size:10px;letter-spacing:.14em;opacity:.55;color:#e8edf4;margin-top:3px}
  .overlay{position:fixed;inset:0;display:grid;place-items:center;background:rgba(5,7,11,.82);
    backdrop-filter:blur(6px);text-align:center;padding:24px;z-index:5}
  .overlay[hidden]{display:none}
  .card{max-width:360px}
  .card h1{margin:0 0 6px;font-size:26px;letter-spacing:-.03em}
  .card p{margin:0 0 16px;font-size:13.5px;line-height:1.6;color:#a9b4c4}
  .card .stat{font:800 40px/1 ui-monospace,monospace;color:#bef264;margin:10px 0 4px}
  .keys{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:14px 0 18px}
  .keys span{font:800 10.5px/1 ui-monospace,monospace;letter-spacing:.06em;padding:6px 9px;border-radius:8px;
    border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);color:#cbd5e1}
  button{appearance:none;border:0;background:#bef264;color:#0b0d12;font:900 13px/1 inherit;
    padding:12px 22px;border-radius:11px;cursor:pointer;letter-spacing:.02em}
  button.ghost{background:transparent;color:#e8edf4;border:1px solid rgba(255,255,255,.18);margin-left:8px}
  .foot{position:fixed;right:14px;bottom:12px;font:700 10px/1 ui-monospace,monospace;
    letter-spacing:.14em;color:rgba(232,237,244,.32);pointer-events:none}
</style>
</head>
<body>
<div id="stage"></div>
<div class="hud" id="hud"></div>
<div class="overlay" id="intro">
  <div class="card">
    <h1>Lane Guard</h1>
    <p>Build towers along a bending track and stop the wave before it reaches the exit. Three tower types, real pathing, and a budget that never quite covers the whole lane.</p>
    <div class="keys"><span>CLICK</span>
    <span>BUILD</span>
    <span>1 2 3</span>
    <span>TOWER TYPE</span>
    <span>12 LIVES</span>
    <span>NO PRESSURE</span></div>
    <button id="go">Play</button>
    <button class="ghost" id="mute" aria-pressed="false">Sound on</button>
  </div>
</div>
<div class="overlay" id="over" hidden>
  <div class="card">
    <p id="overwhy">Run over.</p>
    <div class="stat" id="score">0</div>
    <p id="best" style="margin:0"></p>
    <div style="margin-top:18px">
      <button id="again">Again</button>
    </div>
  </div>
</div>
<div class="foot">GG-LOUNGE ORIGINALS</div>
<script src="../_shared/gg-arcade.js"></script>
<script>/* Lane Guard — place towers that actually think, on a track that actually bends. */
(function () {
  'use strict';
  var view = GGA.createCanvas(document.getElementById('stage'));
  var ctx = view.ctx;
  var hud = document.getElementById('hud');
  var intro = document.getElementById('intro');
  var over = document.getElementById('over');
  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var whyEl = document.getElementById('overwhy');

  var TOWERS = [
    { id: 'pulse', name: 'Pulse', cost: 40, range: 92, dps: 14, colour: '#bef264' },
    { id: 'frost', name: 'Frost', cost: 65, range: 78, dps: 7, colour: '#7dd3ff', slow: 0.45 },
    { id: 'rail', name: 'Rail', cost: 100, range: 150, dps: 22, colour: '#f0abfc' }
  ];

  // The path is a list of waypoints in grid units; enemies walk it, and a tower
  // is only useful if its range circle actually overlaps the polyline.
  var PATH = [[0, 4], [4, 4], [4, 1], [8, 1], [8, 7], [3, 7], [3, 10], [10, 10], [10, 4], [14, 4]];

  var state = 'intro';
  var towers, enemies, shots, credits, lives, wave, waveAt, spawnLeft, spawnAt, selected, spin, best;

  best = GGA.store('best', 0) || 0;

  function reset() {
    towers = [];
    enemies = [];
    shots = [];
    credits = 120;
    lives = 12;
    wave = 0;
    waveAt = 2;
    spawnLeft = 0;
    spawnAt = 0;
    selected = 0;
    spin = 0;
  }

  // The board is 15x12 cells, and 60px of the viewport height belongs to the
  // build palette at the bottom — otherwise the last path row sits underneath
  // it and the exit is hidden behind the tower buttons.
  var PALETTE_H = 62;
  function cell() {
    return Math.min(view.size.w / 15, (view.size.h - PALETTE_H) / 12);
  }
  function origin() {
    var c = cell();
    return { x: (view.size.w - c * 15) / 2, y: (view.size.h - PALETTE_H - c * 12) / 2, c: c };
  }

  function pathPoint(t) {
    // t in [0, pathLength]; walk the polyline to find the point.
    var index = Math.min(PATH.length - 2, Math.floor(t));
    var frac = t - index;
    var a = PATH[index], b = PATH[index + 1];
    return { gx: a[0] + (b[0] - a[0]) * frac, gy: a[1] + (b[1] - a[1]) * frac };
  }

  function startWave() {
    wave++;
    spawnLeft = 4 + wave * 2;
    spawnAt = 0;
  }

  function spawnEnemy() {
    enemies.push({
      t: 0,
      hp: 26 + wave * 14,
      maxHp: 26 + wave * 14,
      speed: 0.85 + wave * 0.05,
      slowUntil: 0,
      slowFactor: 1,
      reward: 6 + wave
    });
  }

  view.canvas.addEventListener('pointerdown', function (event) {
    if (state !== 'play') return;
    var box = view.canvas.getBoundingClientRect();
    var o = origin();
    var gx = Math.floor((event.clientX - box.left - o.x) / o.c);
    var gy = Math.floor((event.clientY - box.top - o.y) / o.c);
    if (gx < 0 || gy < 0 || gx >= 15 || gy >= 12) return;
    // Cannot build on the track.
    for (var i = 0; i < PATH.length - 1; i++) {
      var a = PATH[i], b = PATH[i + 1];
      var minX = Math.min(a[0], b[0]), maxX = Math.max(a[0], b[0]);
      var minY = Math.min(a[1], b[1]), maxY = Math.max(a[1], b[1]);
      if (gx >= minX && gx <= maxX && gy >= minY && gy <= maxY) return;
    }
    if (towers.some(function (t) { return t.gx === gx && t.gy === gy; })) return;
    var spec = TOWERS[selected];
    if (credits < spec.cost) return;
    credits -= spec.cost;
    towers.push({ gx: gx, gy: gy, spec: spec, cool: 0 });
  });
  window.addEventListener('keydown', function (event) {
    if (event.code === 'Digit1') selected = 0;
    if (event.code === 'Digit2') selected = 1;
    if (event.code === 'Digit3') selected = 2;
  });

  function update(dt) {
    spin += dt;
    if (state !== 'play') return;

    if (spawnLeft <= 0 && !enemies.length) {
      waveAt -= dt;
      if (waveAt <= 0) { waveAt = 3.5; startWave(); }
    }
    if (spawnLeft > 0) {
      spawnAt -= dt;
      if (spawnAt <= 0) { spawnAt = 0.62; spawnLeft--; spawnEnemy(); }
    }

    var o = origin();
    enemies.forEach(function (enemy) {
      var slowed = performance.now() < enemy.slowUntil;
      enemy.t += enemy.speed * (slowed ? 0.55 : 1) * dt;
      if (enemy.t >= PATH.length - 1) {
        enemy.dead = true;
        lives--;
        if (lives <= 0) end('The lane was overrun.');
      }
    });
    enemies = enemies.filter(function (e) { return !e.dead; });

    towers.forEach(function (tower) {
      tower.cool -= dt;
      if (tower.cool > 0) return;
      var cx = o.x + (tower.gx + 0.5) * o.c;
      var cy = o.y + (tower.gy + 0.5) * o.c;
      var target = null, bestDist = Infinity;
      enemies.forEach(function (enemy) {
        var p = pathPoint(Math.min(enemy.t, PATH.length - 1.001));
        var ex = o.x + p.gx * o.c, ey = o.y + p.gy * o.c;
        var d = Math.hypot(ex - cx, ey - cy);
        // Target the enemy furthest along the path inside range: that is the
        // one about to escape, which is the only decision a tower needs to make.
        if (d < tower.spec.range && enemy.t < bestDist) { bestDist = enemy.t; target = { enemy: enemy, x: ex, y: ey, d: d }; }
      });
      if (!target) return;
      tower.cool = 0.4;
      target.enemy.hp -= tower.spec.dps * 0.4;
      if (tower.spec.slow) { target.enemy.slowUntil = performance.now() + 900; }
      shots.push({ x: cx, y: cy, tx: target.x, ty: target.y, a: 1, colour: tower.spec.colour });
      if (target.enemy.hp <= 0) {
        target.enemy.dead = true;
        credits += target.enemy.reward;
        scoreDelta(target.enemy.reward * 3);
      }
    });
    enemies = enemies.filter(function (e) { return !e.dead; });

    for (var i = shots.length - 1; i >= 0; i--) {
      shots[i].a -= dt * 4;
      if (shots[i].a <= 0) shots.splice(i, 1);
    }

    hud.innerHTML = score() + ' pts<small>' + credits + ' CREDITS · ' + lives + ' LIVES · WAVE ' + wave + '</small>';
  }

  var earned = 0;
  function scoreDelta(n) { earned += n; }
  function score() { return earned; }

  function end(reason) {
    state = 'dead';
    whyEl.textContent = reason;
    scoreEl.textContent = earned;
    if (earned > best) { best = earned; GGA.store('best', best); }
    bestEl.textContent = 'Best ' + best;
    over.hidden = false;
  }

  function draw() {
    var w = view.size.w, h = view.size.h;
    ctx.fillStyle = '#07090e';
    ctx.fillRect(0, 0, w, h);
    GGA.grid(ctx, w, h, spin * 6, 46, 'rgba(190,242,100,.05)');

    var o = origin();
    // Track.
    ctx.beginPath();
    PATH.forEach(function (point, index) {
      var x = o.x + (point[0] + 0.5) * o.c;
      var y = o.y + (point[1] + 0.5) * o.c;
      if (index === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.strokeStyle = 'rgba(255,255,255,.10)';
    ctx.lineWidth = o.c * 0.86;
    ctx.lineJoin = 'round';
    ctx.stroke();
    ctx.strokeStyle = 'rgba(125,211,255,.22)';
    ctx.lineWidth = 2;
    ctx.stroke();

    towers.forEach(function (tower) {
      var cx = o.x + (tower.gx + 0.5) * o.c;
      var cy = o.y + (tower.gy + 0.5) * o.c;
      ctx.beginPath();
      ctx.arc(cx, cy, o.c * 0.32, 0, Math.PI * 2);
      ctx.fillStyle = tower.spec.colour;
      ctx.globalAlpha = 0.85;
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.beginPath();
      ctx.arc(cx, cy, tower.spec.range, 0, Math.PI * 2);
      ctx.strokeStyle = tower.spec.colour;
      ctx.globalAlpha = 0.10;
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.globalAlpha = 1;
    });

    enemies.forEach(function (enemy) {
      var p = pathPoint(Math.min(enemy.t, PATH.length - 1.001));
      var ex = o.x + p.gx * o.c, ey = o.y + p.gy * o.c;
      var hpFrac = Math.max(0, enemy.hp / enemy.maxHp);
      GGA.glow(ctx, ex, ey, o.c * 0.9, 'rgba(255,122,122,.5)', 0.6);
      ctx.beginPath();
      ctx.arc(ex, ey, o.c * 0.26, 0, Math.PI * 2);
      ctx.fillStyle = performance.now() < enemy.slowUntil ? '#7dd3ff' : '#ff7a7a';
      ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,.45)';
      ctx.fillRect(ex - o.c * 0.3, ey - o.c * 0.44, o.c * 0.6, 3);
      ctx.fillStyle = hpFrac > 0.4 ? '#bef264' : '#fca5a5';
      ctx.fillRect(ex - o.c * 0.3, ey - o.c * 0.44, o.c * 0.6 * hpFrac, 3);
    });

    shots.forEach(function (shot) {
      ctx.globalAlpha = Math.max(0, shot.a);
      ctx.strokeStyle = shot.colour;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(shot.x, shot.y);
      ctx.lineTo(shot.tx, shot.ty);
      ctx.stroke();
    });
    ctx.globalAlpha = 1;

    // Build palette along the bottom.
    var pad = 10;
    TOWERS.forEach(function (spec, index) {
      var bx = pad + index * 132;
      var by = h - 52;
      ctx.fillStyle = selected === index ? 'rgba(190,242,100,.18)' : 'rgba(255,255,255,.05)';
      ctx.fillRect(bx, by, 124, 40);
      ctx.strokeStyle = selected === index ? '#bef264' : 'rgba(255,255,255,.14)';
      ctx.lineWidth = 1;
      ctx.strokeRect(bx + 0.5, by + 0.5, 123, 39);
      ctx.fillStyle = spec.colour;
      ctx.font = '800 11px ui-monospace, monospace';
      ctx.fillText(spec.name + '  ' + spec.cost, bx + 10, by + 18);
      ctx.fillStyle = 'rgba(232,237,244,.5)';
      ctx.font = '700 9px ui-monospace, monospace';
      ctx.fillText('KEY ' + (index + 1) + ' · RANGE ' + spec.range, bx + 10, by + 32);
    });
  }

  var runner = GGA.loop(update, draw);
  function begin() {
    reset();
    earned = 0;
    state = 'play';
    intro.hidden = true;
    over.hidden = true;
    runner.start();
  }
  document.getElementById('go').addEventListener('click', begin);
  document.getElementById('again').addEventListener('click', begin);
  reset();
  draw();
  runner.start();
})();
</script>
</body>
</html>
