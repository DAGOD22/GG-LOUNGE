<html>
  <head>
<script src="/customization-game.js"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Impossible quiz</title>
    <link rel="icon" type="image/x-icon" href="impossiblequiz.png" />
    <link rel="shortcut icon" type="image/x-icon" href="impossiblequiz.png" />
  </head>
  <body>
    
    <div id="ruffle" width="100%" height="100%"></div>
<script data-gg-flash-saves>
      // Keep Flash shared objects (scores, saved levels, unlocks) on disk
      // instead of in memory, so progress survives a reload.
      window.RufflePlayer = window.RufflePlayer || {};
      window.RufflePlayer.config = Object.assign(
        { storage: "disk", localStorage: true, letterbox: "on" },
        window.RufflePlayer.config || {}
      );
    </script>
        <script src="/game-runtime/ruffle/ruffle.js"></script>
    <script>
      window.RufflePlayer = window.RufflePlayer || {};
      window.addEventListener("load", (event) => {
        const ruffle = window.RufflePlayer.newest();
        const player = ruffle.createPlayer();
        const container = document.getElementById("ruffle");
        player.id = "player";
        player.style.width = "100%";
        player.style.height = "100%";
        container.appendChild(player);
        player.ruffle().load("impossible_quiz1.swf");
      });
    </script>
  </body>
</html>
