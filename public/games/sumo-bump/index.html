<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sumo Bump</title>
<style>
  html,body{margin:0;height:100%;background:#07090e;overflow:hidden;
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#e8edf4;
    -webkit-tap-highlight-color:transparent}
  #stage{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
  .hud{position:fixed;left:14px;top:12px;pointer-events:none;font:800 12px/1.4 ui-monospace,SFMono-Regular,monospace;
    letter-spacing:.08em;color:#bef264;text-shadow:0 2px 14px rgba(0,0,0,.7)}
  .hud small{display:block;font-size:10px;letter-spacing:.14em;opacity:.55;color:#e8edf4;margin-top:3px}
  .overlay{position:fixed;inset:0;display:grid;place-items:center;background:rgba(5,7,11,.82);
    backdrop-filter:blur(6px);text-align:center;padding:24px;z-index:5}
  .overlay[hidden]{display:none}
  .card{max-width:360px}
  .card h1{margin:0 0 6px;font-size:26px;letter-spacing:-.03em}
  .card p{margin:0 0 16px;font-size:13.5px;line-height:1.6;color:#a9b4c4}
  .card .stat{font:800 40px/1 ui-monospace,monospace;color:#bef264;margin:10px 0 4px}
  .keys{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:14px 0 18px}
  .keys span{font:800 10.5px/1 ui-monospace,monospace;letter-spacing:.06em;padding:6px 9px;border-radius:8px;
    border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);color:#cbd5e1}
  button{appearance:none;border:0;background:#bef264;color:#0b0d12;font:900 13px/1 inherit;
    padding:12px 22px;border-radius:11px;cursor:pointer;letter-spacing:.02em}
  button.ghost{background:transparent;color:#e8edf4;border:1px solid rgba(255,255,255,.18);margin-left:8px}
  .foot{position:fixed;right:14px;bottom:12px;font:700 10px/1 ui-monospace,monospace;
    letter-spacing:.14em;color:rgba(232,237,244,.32);pointer-events:none}
</style>
</head>
<body>
<div id="stage"></div>
<div class="hud" id="hud"></div>
<div class="overlay" id="intro">
  <div class="card">
    <h1>Sumo Bump</h1>
    <p>Two players, one shrinking ring, no weapons. Charge your friend out of the circle before it closes on you both.</p>
    <div class="keys"><span>W A S D</span>
    <span>PLAYER ONE</span>
    <span>ARROWS</span>
    <span>PLAYER TWO</span>
    <span>FIRST TO 3</span>
    <span>WINS</span></div>
    <button id="go">Play</button>
    <button class="ghost" id="mute" aria-pressed="false">Sound on</button>
  </div>
</div>
<div class="overlay" id="over" hidden>
  <div class="card">
    <p id="overwhy">Run over.</p>
    <div class="stat" id="score">0</div>
    <p id="best" style="margin:0"></p>
    <div style="margin-top:18px">
      <button id="again">Again</button>
    </div>
  </div>
</div>
<div class="foot">GG-LOUNGE ORIGINALS</div>
<script src="../_shared/gg-arcade.js"></script>
<script>/* Sumo Bump — two players, one shrinking ring, no weapons. */
(function () {
  'use strict';
  var view = GGA.createCanvas(document.getElementById('stage'));
  var ctx = view.ctx;
  var input = GGA.input(view.canvas);
  var hud = document.getElementById('hud');
  var intro = document.getElementById('intro');
  var over = document.getElementById('over');
  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var whyEl = document.getElementById('overwhy');

  var state = 'intro';
  var players, ring, shove, clock, wins, best, spin;
  best = GGA.store('best', 0) || 0;

  function reset() {
    var r = Math.min(view.size.w, view.size.h) * 0.36;
    ring = { x: view.size.w / 2, y: view.size.h / 2, r: r, shrinkAt: 0 };
    players = [
      { x: ring.x - r * 0.45, y: ring.y, vx: 0, vy: 0, r: 20, colour: '#bef264', keys: { up: 'KeyW', down: 'KeyS', left: 'KeyA', right: 'KeyD' }, name: 'WASD', alive: true },
      { x: ring.x + r * 0.45, y: ring.y, vx: 0, vy: 0, r: 20, colour: '#7dd3ff', keys: { up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight' }, name: 'ARROWS', alive: true },
    ];
    shove = [];
    clock = 0;
    spin = 0;
    wins = [0, 0];
  }

  // Two keyboards means reading physical key state, not the shared action map.
  var held = {};
  window.addEventListener('keydown', function (e) { held[e.code] = true; });
  window.addEventListener('keyup', function (e) { held[e.code] = false; });

  function bump(a, b) {
    var dx = b.x - a.x, dy = b.y - a.y;
    var dist = Math.sqrt(dx * dx + dy * dy) || 1;
    var overlap = a.r + b.r - dist;
    if (overlap <= 0) return;
    var nx = dx / dist, ny = dy / dist;
    // Both are pushed apart; the faster one keeps more of its momentum, which
    // is what makes a charge feel like it landed.
    a.x -= nx * overlap * 0.5; a.y -= ny * overlap * 0.5;
    b.x += nx * overlap * 0.5; b.y += ny * overlap * 0.5;
    var relative = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
    if (relative < 0) {
      a.vx += nx * relative * 0.7; a.vy += ny * relative * 0.7;
      b.vx -= nx * relative * 0.7; b.vy -= ny * relative * 0.7;
      if (Math.abs(relative) > 90) {
        shove.push({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, a: 1, r: 12 + Math.abs(relative) * 0.12 });
      }
    }
  }

  function out(p) {
    return Math.hypot(p.x - ring.x, p.y - ring.y) > ring.r + p.r * 0.25;
  }

  function update(dt) {
    spin += dt;
    if (state !== 'play') return;
    clock += dt;
    ring.shrinkAt += dt;
    if (ring.shrinkAt > 1.4 && ring.r > Math.min(view.size.w, view.size.h) * 0.13) {
      ring.r -= 4.4 * dt;
      ring.shrinkAt = 0;
    }

    players.forEach(function (p) {
      if (!p.alive) return;
      var ax = 0, ay = 0;
      if (held[p.keys.left]) ax -= 1;
      if (held[p.keys.right]) ax += 1;
      if (held[p.keys.up]) ay -= 1;
      if (held[p.keys.down]) ay += 1;
      var len = Math.hypot(ax, ay) || 1;
      p.vx += (ax / len) * 620 * dt;
      p.vy += (ay / len) * 620 * dt;
      var drag = Math.pow(0.0022, dt);
      p.vx *= drag;
      p.vy *= drag;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
    });

    bump(players[0], players[1]);

    players.forEach(function (p, index) {
      if (!p.alive) return;
      if (out(p)) {
        p.alive = false;
        wins[1 - index]++;
        var winner = 1 - index;
        if (wins[winner] >= 3) {
          state = 'dead';
          whyEl.textContent = (winner === 0 ? 'WASD' : 'ARROWS') + ' takes the ring.';
          var total = wins[0] + wins[1];
          scoreEl.textContent = total;
          if (total > best) { best = total; GGA.store('best', best); }
          bestEl.textContent = 'Rounds played ' + best;
          over.hidden = false;
        } else {
          window.setTimeout(function () {
            if (state !== 'play') return;
            reset();
          }, 700);
          ring.r = Math.min(view.size.w, view.size.h) * 0.36;
          ring.x = view.size.w / 2;
          ring.y = view.size.h / 2;
        }
      }
    });

    for (var i = shove.length - 1; i >= 0; i--) {
      shove[i].a -= dt * 2.2;
      shove[i].r += dt * 60;
      if (shove[i].a <= 0) shove.splice(i, 1);
    }

    hud.innerHTML = wins[0] + ' — ' + wins[1] + '<small>' + (wins[0] === 2 || wins[1] === 2 ? 'MATCH POINT' : 'FIRST TO 3') + '</small>';
  }

  function draw() {
    var w = view.size.w, h = view.size.h;
    ctx.fillStyle = '#07090e';
    ctx.fillRect(0, 0, w, h);
    GGA.grid(ctx, w, h, spin * 12, 64, 'rgba(255,255,255,.04)');

    GGA.glow(ctx, ring.x, ring.y, ring.r * 1.5, 'rgba(190,242,100,.10)', 1);
    ctx.beginPath();
    ctx.arc(ring.x, ring.y, ring.r, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,.03)';
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = ring.r < Math.min(w, h) * 0.2 ? '#fca5a5' : 'rgba(190,242,100,.55)';
    ctx.stroke();

    shove.forEach(function (s) {
      ctx.globalAlpha = Math.max(0, s.a) * 0.5;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.stroke();
    });
    ctx.globalAlpha = 1;

    players.forEach(function (p) {
      if (!p.alive) return;
      GGA.glow(ctx, p.x, p.y, p.r * 2.4, p.colour, 0.35);
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = p.colour;
      ctx.fill();
      ctx.font = '800 10px ui-monospace, monospace';
      ctx.fillStyle = 'rgba(232,237,244,.8)';
      ctx.textAlign = 'center';
      ctx.fillText(p.name, p.x, p.y + p.r + 16);
      ctx.textAlign = 'left';
    });
  }

  var runner = GGA.loop(update, draw);
  function begin() {
    reset();
    state = 'play';
    intro.hidden = true;
    over.hidden = true;
    runner.start();
  }
  document.getElementById('go').addEventListener('click', begin);
  document.getElementById('again').addEventListener('click', begin);
  reset();
  draw();
  runner.start();
})();
</script>
</body>
</html>
