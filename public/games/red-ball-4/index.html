<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Red Ball 4 — GG Lounge</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  ruffle-player { width: 100%; height: 100%; }
  #vols { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; gap: 8px; }
  #vols button {
    padding: 7px 16px; border-radius: 99px; border: 1px solid rgba(255,255,255,.35);
    background: rgba(0,0,0,.55); color: #fff; font-weight: 800; font-size: 13px; cursor: pointer;
  }
  #vols button.on { background: #e23b3b; border-color: #e23b3b; }
</style>
<script>
  window.RufflePlayer = window.RufflePlayer || {};
  window.RufflePlayer.config = {
    autoplay: "auto", unmuteOverlay: "visible", backgroundColor: "black",
    letterbox: "fullscreen", scale: "showAll", warnOnUnsupportedContent: false,
    showSwfDownload: false, contextMenu: true, polyfills: true,
  };
</script>
<script src="ruffle/ruffle.js"></script>
</head>
<body>
<div id="vols">
  <button data-swf="redball4.swf" class="on">Vol. 1</button>
  <button data-swf="redball4v2.swf">Vol. 2</button>
  <button data-swf="redball4v3.swf">Vol. 3</button>
</div>
<div id="stage"></div>
<script>
  function play(swf) {
    var stage = document.getElementById("stage");
    stage.innerHTML = "";
    var player = window.RufflePlayer.newest().createPlayer();
    player.style.width = "100%";
    player.style.height = "100%";
    stage.appendChild(player);
    player.load(swf);
  }
  document.querySelectorAll("#vols button").forEach(function (b) {
    b.addEventListener("click", function () {
      document.querySelectorAll("#vols button").forEach(function (x) { x.classList.remove("on"); });
      b.classList.add("on");
      play(b.getAttribute("data-swf"));
    });
  });
  window.addEventListener("load", function () { play("redball4.swf"); });
</script>
</body>
</html>
