<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>2048</title>
<link rel="icon" href="/brand/icon-32.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0d0f16" />
<style>
  :root{
    --bg:var(--gg-bg,#0d0f16); --panel:var(--gg-panel,#171a24); --text:var(--gg-text,#f2f4f8);
    --muted:var(--gg-muted,#98a0b3); --line:var(--gg-line,rgba(255,255,255,.1)); --accent:var(--gg-accent,#def75c);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:500 15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overscroll-behavior:none}
  .wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom))}
  .top{width:100%;max-width:460px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
  h1{margin:0;font-size:clamp(34px,10vw,50px);letter-spacing:-.05em;font-weight:900}
  h1 span{color:var(--accent)}
  .scores{display:flex;gap:8px}
  .score{min-width:78px;padding:7px 10px;border-radius:12px;background:var(--panel);border:1px solid var(--line);text-align:center}
  .score b{display:block;font-size:18px;letter-spacing:-.02em}
  .score small{display:block;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .row{width:100%;max-width:460px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .hint{color:var(--muted);font-size:12px}
  button{font:inherit;font-weight:800;color:#0b0d12;background:var(--accent);border:0;border-radius:11px;padding:10px 16px;cursor:pointer}
  button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
  .board{position:relative;width:min(94vw,460px);aspect-ratio:1;padding:10px;border-radius:18px;background:var(--panel);border:1px solid var(--line);touch-action:none;box-shadow:0 24px 60px rgba(0,0,0,.35)}
  .grid,.tiles{position:absolute;inset:10px}
  .cell{position:absolute;border-radius:12px;background:rgba(255,255,255,.045)}
  .tile{position:absolute;display:grid;place-items:center;border-radius:12px;font-weight:900;letter-spacing:-.04em;transition:transform .11s ease-out;background:#2b3040;color:#fff}
  .tile.new{animation:pop .16s ease-out}
  .tile.merged{animation:merge .19s ease-out}
  @keyframes pop{from{transform:scale(.6)}to{transform:scale(1)}}
  @keyframes merge{0%{transform:scale(1)}45%{transform:scale(1.16)}100%{transform:scale(1)}}
  .over{position:absolute;inset:0;display:none;place-items:center;flex-direction:column;gap:12px;border-radius:18px;background:rgba(8,10,15,.82);backdrop-filter:blur(4px);text-align:center;font-weight:900;font-size:26px}
  .over.show{display:grid}
  .over p{margin:0;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .keys{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
  .keys kbd{min-width:44px;padding:9px 0;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.05);font:inherit;font-size:13px;color:var(--muted);text-align:center}
  @media(hover:none){.keys{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>20<span>48</span></h1>
    <div class="scores">
      <div class="score"><b id="score">0</b><small>score</small></div>
      <div class="score"><b id="best">0</b><small>best</small></div>
    </div>
  </div>
  <div class="row">
    <div class="hint">Join the tiles, get to <b>2048</b>. Swipe or use arrow keys.</div>
    <div style="display:flex;gap:8px">
      <button id="undo" class="ghost">Undo</button>
      <button id="new">New game</button>
    </div>
  </div>
  <div class="board" id="board">
    <div class="grid" id="grid"></div>
    <div class="tiles" id="tiles"></div>
    <div class="over" id="over"><div id="overText">Game over</div><p id="overSub">no moves left</p><div><button id="again">Try again</button></div></div>
  </div>
  <div class="keys"><kbd>←</kbd><kbd>↓</kbd><kbd>↑</kbd><kbd>→</kbd><kbd>U</kbd></div>
</div>
<script>
(function () {
  'use strict';
  var N = 4;
  var palette = {
    2:    ['#39415a', '#e9edf7'],
    4:    ['#465075', '#eef2fb'],
    8:    ['#c9a227', '#20180a'],
    16:   ['#e08b2e', '#201206'],
    32:   ['#df5f45', '#fff'],
    64:   ['#e0413b', '#fff'],
    128:  ['#ded94f', '#241f00'],
    256:  ['#d7f34a', '#1d2405'],
    512:  ['#b9e335', '#141a03'],
    1024: ['#8fd42a', '#0d1402'],
    2048: ['#def75c', '#0b0d12']
  };
  var cells = [], score = 0, best = 0, history = [], won = false, idSeq = 1;
  var gridEl = document.getElementById('grid');
  var tilesEl = document.getElementById('tiles');
  var boardEl = document.getElementById('board');
  var overEl = document.getElementById('over');

  try { best = parseInt(localStorage.getItem('gg2048.best') || '0', 10) || 0; } catch (e) { best = 0; }

  function pct(i) { return (i * 25) + '%'; }

  // background grid (drawn once)
  for (var r = 0; r < N; r++) {
    for (var c = 0; c < N; c++) {
      var d = document.createElement('div');
      d.className = 'cell';
      d.style.width = 'calc(25% - 7.5px)';
      d.style.height = 'calc(25% - 7.5px)';
      d.style.left = 'calc(' + pct(c) + ' + 4px)';
      d.style.top = 'calc(' + pct(r) + ' + 4px)';
      gridEl.appendChild(d);
    }
  }

  function blank() {
    cells = [];
    for (var i = 0; i < N * N; i++) cells.push(0);
  }
  function at(r, c) { return r < 0 || c < 0 || r >= N || c >= N ? null : cells[r * N + c]; }
  function setAt(r, c, v) { cells[r * N + c] = v; }

  function spawn() {
    var empty = [];
    for (var i = 0; i < cells.length; i++) if (!cells[i]) empty.push(i);
    if (!empty.length) return null;
    var idx = empty[(Math.random() * empty.length) | 0];
    cells[idx] = { v: Math.random() < 0.9 ? 2 : 4, id: idSeq++, fresh: true, merged: false, r: (idx / N) | 0, c: idx % N };
    return cells[idx];
  }

  function reset() {
    blank(); score = 0; won = false; history = [];
    spawn(); spawn();
    overEl.classList.remove('show');
    draw();
  }

  function snapshot() {
    return { cells: cells.map(function (t) { return t ? t.v : 0; }), score: score };
  }
  function restore(snap) {
    blank();
    score = snap.score;
    for (var i = 0; i < snap.cells.length; i++) {
      if (snap.cells[i]) cells[i] = { v: snap.cells[i], id: idSeq++, r: (i / N) | 0, c: i % N, fresh: false, merged: false };
    }
    draw();
  }

  function draw() {
    var html = '';
    for (var r = 0; r < N; r++) {
      for (var c = 0; c < N; c++) {
        var t = at(r, c);
        if (!t) continue;
        var pal = palette[t.v] || ['#def75c', '#0b0d12'];
        var size = t.v < 100 ? 30 : t.v < 1000 ? 25 : 20;
        html += '<div class="tile' + (t.fresh ? ' new' : t.merged ? ' merged' : '') + '" style="' +
          'width:calc(25% - 8px);height:calc(25% - 8px);' +
          'left:calc(' + pct(c) + ' + 4px);top:calc(' + pct(r) + ' + 4px);' +
          'background:' + pal[0] + ';color:' + pal[1] + ';font-size:clamp(18px,' + (size / 4.6) + 'vw,44px)">' + t.v + '</div>';
      }
    }
    tilesEl.innerHTML = html;
    document.getElementById('score').textContent = score;
    if (score > best) {
      best = score;
      try { localStorage.setItem('gg2048.best', String(best)); } catch (e) { /* private mode */ }
    }
    document.getElementById('best').textContent = best;
  }

  // dir: 0 left, 1 right, 2 up, 3 down
  // Each move is done line by line: pull the line out (ordered from the edge the
  // tiles slide toward), compact + merge, write it back. No in-place mutation,
  // which is where sliding puzzles usually go wrong.
  function lineCoords(lineIdx, dir) {
    var out = [];
    for (var k = 0; k < N; k++) {
      if (dir === 0) out.push([lineIdx, k]);
      else if (dir === 1) out.push([lineIdx, N - 1 - k]);
      else if (dir === 2) out.push([k, lineIdx]);
      else out.push([N - 1 - k, lineIdx]);
    }
    return out;
  }

  function move(dir) {
    var before = snapshot();
    var moved = false, gained = 0;

    for (var line = 0; line < N; line++) {
      var coords = lineCoords(line, dir);
      var tiles = coords.map(function (rc) { return at(rc[0], rc[1]) || null; }).filter(Boolean);
      var out = [];
      for (var i = 0; i < tiles.length; i++) {
        var t = tiles[i];
        t.fresh = false; t.merged = false;
        var prev = out[out.length - 1];
        if (prev && prev.v === t.v && !prev.merged) {
          prev.v *= 2;
          prev.merged = true;
          prev.id = t.id;
          gained += prev.v;
          if (prev.v === 2048 && !won) { won = true; showOver('You win!', '2048 reached — keep going'); }
        } else {
          out.push(t);
        }
      }
      for (var p = 0; p < N; p++) {
        var rc2 = coords[p];
        var want = out[p] || 0;
        if (at(rc2[0], rc2[1]) !== want) moved = true;
        setAt(rc2[0], rc2[1], want);
        if (want) { want.r = rc2[0]; want.c = rc2[1]; }
      }
    }

    if (!moved) return false;
    score += gained;
    history.push(before);
    if (history.length > 30) history.shift();
    spawn();
    draw();
    if (!canMove()) showOver('Game over', 'no moves left');
    return true;
  }

  function canMove() {
    for (var r = 0; r < N; r++) {
      for (var c = 0; c < N; c++) {
        var t = at(r, c);
        if (!t) return true;
        var right = at(r, c + 1), down = at(r + 1, c);
        if (right && right.v === t.v) return true;
        if (down && down.v === t.v) return true;
      }
    }
    return false;
  }

  function showOver(title, sub) {
    document.getElementById('overText').textContent = title;
    document.getElementById('overSub').textContent = sub;
    overEl.classList.add('show');
  }

  document.addEventListener('keydown', function (e) {
    var k = e.key;
    var dir = k === 'ArrowLeft' || k === 'a' || k === 'A' ? 0
      : k === 'ArrowRight' || k === 'd' || k === 'D' ? 1
      : k === 'ArrowUp' || k === 'w' || k === 'W' ? 2
      : k === 'ArrowDown' || k === 's' || k === 'S' ? 3 : -1;
    if (dir >= 0) { e.preventDefault(); move(dir); return; }
    if (k === 'u' || k === 'U') { e.preventDefault(); undo(); return; }
    if (k === 'n' || k === 'N') { e.preventDefault(); reset(); }
  });

  function undo() {
    if (!history.length) return;
    restore(history.pop());
    overEl.classList.remove('show');
  }

  // touch / pen
  var sx = 0, sy = 0, tracking = false;
  boardEl.addEventListener('pointerdown', function (e) {
    tracking = true; sx = e.clientX; sy = e.clientY;
    try { boardEl.setPointerCapture(e.pointerId); } catch (err) { /* noop */ }
  });
  boardEl.addEventListener('pointerup', function (e) {
    if (!tracking) return;
    tracking = false;
    var dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.abs(dx) < 22 && Math.abs(dy) < 22) return;
    move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 0) : (dy > 0 ? 3 : 2));
  });
  boardEl.addEventListener('pointercancel', function () { tracking = false; });

  document.getElementById('new').addEventListener('click', reset);
  document.getElementById('again').addEventListener('click', reset);
  document.getElementById('undo').addEventListener('click', undo);

  reset();
})();
</script>
<script src="/gg/gg-boot.js"></script>
</body>
</html>
