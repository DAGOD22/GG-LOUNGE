<!doctype html>
<html>
  <head><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Lounge"><meta name="theme-color" content="#0d0f16"><link rel="icon" href="/brand/icon-32.png"><link rel="apple-touch-icon" href="/brand/icon-180.png"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <meta charset="utf-8">
    <title>Doodle Jump</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="container">
      <canvas id="canvas">Aww, your browser doesn't support HTML5!</canvas>
      <div id="mainMenu">
        <h1>doodle jump</h1>
        <h3>using HTML5,</h3>
        <p class="info">use <span class="key left">←</span> <span class="key right">→</span> to move and space to (re) start...</p>
        <a class="button" href="javascript:init()">Play</a>
      </div>
      <div id="gameOverMenu">
        <h1>game over!</h1>
        <h3 id="go_score">you scored 0 points</h3>
        <a class="button" href="javascript:reset()">Restart</a>
      </div>
      <img id="sprite" src="sprites.png"/>
      <div id="scoreBoard">
        <p id="score">0</p>
      </div>
    </div>
    <script src="main.js"></script>
    
  <script src="/gg/gg-boot.js"></script></body>
</html>
