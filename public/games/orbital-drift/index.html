<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Orbital Drift</title>
<style>
  html,body{margin:0;height:100%;background:#07090e;overflow:hidden;
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#e8edf4;
    -webkit-tap-highlight-color:transparent}
  #stage{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
  .hud{position:fixed;left:14px;top:12px;pointer-events:none;font:800 12px/1.4 ui-monospace,SFMono-Regular,monospace;
    letter-spacing:.08em;color:#bef264;text-shadow:0 2px 14px rgba(0,0,0,.7)}
  .hud small{display:block;font-size:10px;letter-spacing:.14em;opacity:.55;color:#e8edf4;margin-top:3px}
  .overlay{position:fixed;inset:0;display:grid;place-items:center;background:rgba(5,7,11,.82);
    backdrop-filter:blur(6px);text-align:center;padding:24px;z-index:5}
  .overlay[hidden]{display:none}
  .card{max-width:360px}
  .card h1{margin:0 0 6px;font-size:26px;letter-spacing:-.03em}
  .card p{margin:0 0 16px;font-size:13.5px;line-height:1.6;color:#a9b4c4}
  .card .stat{font:800 40px/1 ui-monospace,monospace;color:#bef264;margin:10px 0 4px}
  .keys{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:14px 0 18px}
  .keys span{font:800 10.5px/1 ui-monospace,monospace;letter-spacing:.06em;padding:6px 9px;border-radius:8px;
    border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);color:#cbd5e1}
  button{appearance:none;border:0;background:#bef264;color:#0b0d12;font:900 13px/1 inherit;
    padding:12px 22px;border-radius:11px;cursor:pointer;letter-spacing:.02em}
  button.ghost{background:transparent;color:#e8edf4;border:1px solid rgba(255,255,255,.18);margin-left:8px}
  .foot{position:fixed;right:14px;bottom:12px;font:700 10px/1 ui-monospace,monospace;
    letter-spacing:.14em;color:rgba(232,237,244,.32);pointer-events:none}
</style>
</head>
<body>
<div id="stage"></div>
<div class="hud" id="hud"></div>
<div class="overlay" id="intro">
  <div class="card">
    <h1>Orbital Drift</h1>
    <p>Thread the ship between asteroids by riding the sun’s pull. Hold to fall in, release to coast out.</p>
    <div class="keys"><span>HOLD — GRAVITY</span>
    <span>SPACE / CLICK</span>
    <span>GAP = SCORE</span></div>
    <button id="go">Play</button>
    <button class="ghost" id="mute" aria-pressed="false">Sound on</button>
  </div>
</div>
<div class="overlay" id="over" hidden>
  <div class="card">
    <p id="overwhy">Run over.</p>
    <div class="stat" id="score">0</div>
    <p id="best" style="margin:0"></p>
    <div style="margin-top:18px">
      <button id="again">Again</button>
    </div>
  </div>
</div>
<div class="foot">GG-LOUNGE ORIGINALS</div>
<script src="../_shared/gg-arcade.js"></script>
<script>/* Orbital Drift — hold to fall into orbit, release to fly outward. */
(function () {
  'use strict';
  var view = GGA.createCanvas(document.getElementById('stage'));
  var ctx = view.ctx;
  var input = GGA.input(view.canvas);
  var hud = document.getElementById('hud');
  var intro = document.getElementById('intro');
  var over = document.getElementById('over');
  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var whyEl = document.getElementById('overwhy');

  var stars = [];
  for (var i = 0; i < 90; i++) {
    stars.push({ x: Math.random(), y: Math.random(), r: GGA.rand(0.4, 1.6), s: GGA.rand(0.4, 2.4) });
  }

  var state = 'intro';    // intro | play | dead
  var ship, rocks, trail, orbited, distance, time, spawnAt, spin, best;
  best = GGA.store('best', 0) || 0;

  function reset() {
    ship = { x: view.size.w * 0.32, y: view.size.h / 2, vy: 0, r: 9, angle: 0 };
    rocks = [];
    trail = [];
    orbited = 0;
    distance = 0;
    time = 0;
    spawnAt = 0.6;
    spin = 0;
    input.reset();
  }

  function spawnRock() {
    var gap = view.size.h * 0.34;
    var cy = GGA.rand(gap * 0.5, view.size.h - gap * 0.5);
    var r = GGA.rand(26, 54);
    rocks.push({ x: view.size.w + r + 40, y: cy, r: r, gap: gap * GGA.rand(0.72, 1.05), scored: false, seed: Math.random() * 999 });
  }

  function update(dt) {
    spin += dt;
    for (var i = 0; i < stars.length; i++) {
      stars[i].x -= (state === 'play' ? 0.06 : 0.02) * stars[i].s * dt * 60 * 0.016;
      if (stars[i].x < 0) { stars[i].x += 1; stars[i].y = Math.random(); }
    }
    if (state !== 'play') return;

    time += dt;
    // Hold = gravity pulls you in; release = you coast outward. The two forces
    // are balanced so hovering is possible but never free.
    ship.vy += (input.keys.action ? 620 : -190) * dt;
    ship.vy = GGA.clamp(ship.vy, -420, 520);
    ship.y += ship.vy * dt;
    ship.angle = GGA.clamp(ship.vy / 700, -0.5, 0.5);
    distance += dt * 128;

    var speed = 210 + Math.min(180, time * 11);
    if (time > spawnAt) { spawnRock(); spawnAt = time + GGA.rand(0.72, 1.02) * (150 / speed) * 1.35; }

    trail.unshift({ x: ship.x, y: ship.y, a: 1 });
    if (trail.length > 22) trail.pop();
    for (var t = 0; t < trail.length; t++) trail[t].a -= dt * 1.7;

    for (var j = rocks.length - 1; j >= 0; j--) {
      var rock = rocks[j];
      rock.x -= speed * dt;
      var dx = rock.x - ship.x;
      var dy = rock.y - ship.y;
      var dist = Math.sqrt(dx * dx + dy * dy);
      // Ship slides past on either side through the gap. Touching the rim ends it.
      if (dist < rock.r + ship.r) { die('You clipped an asteroid.'); return; }
      if (!rock.scored && rock.x < ship.x - rock.r) {
        rock.scored = true;
        orbited++;
        distance += 120;
      }
      if (rock.x < -rock.r - 30) rocks.splice(j, 1);
    }

    if (ship.y < ship.r) { ship.y = ship.r; ship.vy = Math.abs(ship.vy) * 0.4; }
    if (ship.y > view.size.h - ship.r) { ship.y = view.size.h - ship.r; ship.vy = -Math.abs(ship.vy) * 0.4; }

    var points = Math.floor(distance / 10) + orbited * 25;
    hud.innerHTML = points + ' pts<small>' + orbited + ' ORBITED · ' + Math.floor(distance / 10) + ' m</small>';
  }

  function die(reason) {
    state = 'dead';
    whyEl.textContent = reason;
    var points = Math.floor(distance / 10) + orbited * 25;
    scoreEl.textContent = points;
    if (points > best) { best = points; GGA.store('best', best); }
    bestEl.textContent = 'Best ' + best;
    over.hidden = false;
  }

  function draw() {
    var w = view.size.w, h = view.size.h;
    ctx.fillStyle = '#07090e';
    ctx.fillRect(0, 0, w, h);
    GGA.grid(ctx, w, h, spin * 34, 70, 'rgba(125,211,255,.06)');

    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      ctx.globalAlpha = 0.15 + s.r * 0.28;
      ctx.fillStyle = '#cfe6ff';
      ctx.fillRect(s.x * w, s.y * h, s.r, s.r);
    }
    ctx.globalAlpha = 1;

    // The sun the ship is falling around.
    GGA.glow(ctx, w * 0.14, h / 2, 190, 'rgba(190,242,100,.22)', 0.9);
    ctx.beginPath();
    ctx.arc(w * 0.14, h / 2, 34 + Math.sin(spin * 1.8) * 3, 0, Math.PI * 2);
    ctx.fillStyle = '#bef264';
    ctx.fill();

    for (var t = trail.length - 1; t >= 0; t--) {
      var point = trail[t];
      ctx.globalAlpha = Math.max(0, point.a) * 0.5;
      ctx.beginPath();
      ctx.arc(point.x, point.y, ship.r * (1 - t / trail.length) * 0.9, 0, Math.PI * 2);
      ctx.fillStyle = '#7dd3ff';
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    for (var j = 0; j < rocks.length; j++) {
      var rock = rocks[j];
      ctx.save();
      ctx.translate(rock.x, rock.y);
      ctx.rotate(rock.seed + spin * 0.3);
      ctx.beginPath();
      // A lumpy circle reads as rock; a perfect circle reads as a ball.
      for (var k = 0; k < 9; k++) {
        var a = (k / 9) * Math.PI * 2;
        var rr = rock.r * (0.82 + ((Math.sin(rock.seed + k * 2.7) + 1) / 2) * 0.28);
        ctx[k ? 'lineTo' : 'moveTo'](Math.cos(a) * rr, Math.sin(a) * rr);
      }
      ctx.closePath();
      ctx.fillStyle = '#1c2333';
      ctx.fill();
      ctx.strokeStyle = 'rgba(190,242,100,.35)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.restore();
    }

    ctx.save();
    ctx.translate(ship.x, ship.y);
    ctx.rotate(ship.angle);
    ctx.beginPath();
    ctx.moveTo(14, 0);
    ctx.lineTo(-8, -8);
    ctx.lineTo(-4, 0);
    ctx.lineTo(-8, 8);
    ctx.closePath();
    ctx.fillStyle = '#e8edf4';
    ctx.fill();
    if (input.keys.action) {
      GGA.glow(ctx, -10, 0, 22, 'rgba(125,211,255,.9)', 0.8);
    }
    ctx.restore();
  }

  var runner = GGA.loop(update, draw);

  function begin() {
    reset();
    state = 'play';
    intro.hidden = true;
    over.hidden = true;
    hud.innerHTML = '0 pts<small>0 ORBITED</small>';
    runner.start();
  }

  document.getElementById('go').addEventListener('click', begin);
  document.getElementById('again').addEventListener('click', begin);
  reset();
  draw();
  runner.start();
})();
</script>
</body>
</html>
