<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Sudoku</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
           background: #f4f1ea; color: #22201d; font-family: system-ui, sans-serif; }
    #app { width: min(92vmin, 620px); }
    #board { display: grid; grid-template-columns: repeat(9, 1fr); border: 3px solid #22201d; }
    #board input { aspect-ratio: 1; border: 1px solid #c9c2b4; background: #fff;
                   text-align: center; font-size: clamp(16px, 3.4vmin, 26px); color: #22201d; }
    #board input.given { background: #e7e1d3; font-weight: 700; }
    #board input:nth-child(9n+3), #board input:nth-child(9n+6) { border-right: 3px solid #22201d; }
    #board input:nth-child(n+19):nth-child(-n+27),
    #board input:nth-child(n+46):nth-child(-n+54) { border-bottom: 3px solid #22201d; }
    #board input:focus { outline: 2px solid #c0533a; }
    .row { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
    button { padding: 9px 16px; border: 0; border-radius: 6px; background: #22201d;
             color: #f4f1ea; font-size: 15px; cursor: pointer; }
    button.alt { background: #c0533a; }
    #status { margin-top: 10px; min-height: 20px; font-size: 14px; color: #6b6357; }
  </style>
</head>
<body>
  <div id="app">
    <h1 style="font-size: clamp(20px,3vmin,28px);margin:0 0 12px;">Sudoku</h1>
    <div id="board"></div>
    <div class="row">
      <button id="new">New puzzle</button>
      <button id="check" class="alt">Check</button>
      <button id="solve">Solve</button>
    </div>
    <div id="status">Fill the grid so every row, column and box holds 1–9.</div>
  </div>
  <script src="sudoku.js"></script>
  <script>
    const board = document.getElementById('board');
    const status = document.getElementById('status');
    let puzzle = [], solution = [], cells = [];

    function render(values, givens) {
      board.innerHTML = '';
      cells = [];
      for (let r = 0; r < 9; r++) {
        for (let c = 0; c < 9; c++) {
          const input = document.createElement('input');
          input.inputMode = 'numeric';
          input.maxLength = 1;
          const v = values[r * 9 + c];
          input.value = v === 0 ? '' : String(v);
          input.classList.toggle('given', givens[r * 9 + c] !== 0);
          input.readOnly = givens[r * 9 + c] !== 0;
          input.addEventListener('input', () => {
            input.value = input.value.replace(/[^1-9]/g, '');
          });
          board.appendChild(input);
          cells.push(input);
        }
      }
    }

    function start() {
      const generated = sudoku.generate(40);      // 40 empty cells
      puzzle = generated.split('').map(ch => ch === '.' ? 0 : Number(ch));
      const solved = sudoku.solve(generated);
      solution = solved.split('').map(ch => ch === '.' ? 0 : Number(ch));
      render(puzzle, puzzle);
      status.textContent = 'Fill the grid so every row, column and box holds 1–9.';
    }

    document.getElementById('new').onclick = start;
    document.getElementById('check').onclick = () => {
      const current = cells.map(cell => Number(cell.value) || 0);
      const wrong = current.filter((v, i) => v !== 0 && v !== solution[i]).length;
      const blanks = current.filter(v => v === 0).length;
      status.textContent = wrong
        ? `${wrong} square${wrong > 1 ? 's' : ''} not right yet — ${blanks} still empty.`
        : blanks ? `Correct so far, ${blanks} squares to go.` : 'Solved. Nice work.';
    };
    document.getElementById('solve').onclick = () => {
      render(solution, solution);
      status.textContent = 'Here is the solution — press New puzzle to try again.';
    };
    start();
  </script>
</body>
</html>
