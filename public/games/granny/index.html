<!DOCTYPE html>
<html lang="en-us">
<head>
    <title>Granny Original</title>
    <meta charset="utf-8">
    <meta name="robots" content="noindex, nofollow">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <link rel="stylesheet" href="TemplateData/style.css">
    <script src="sdk.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000 url('logo.png') no-repeat center center fixed;
            background-size: cover;
        }

        #unity-container {
            position: absolute;
            width: 100%;
            height: 100%;
            left: 0;
            top: 0;
        }

        #unity-loading-bar {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            height: 20px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #ffffff;
            border-radius: 10px;
            display: block;
        }

        #unity-logo {
            position: absolute;
            top: calc(50% - 100px);
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: auto;
        }

        #unity-logo img {
            max-width: 100%;
            height: auto;
        }

        #unity-progress-bar-empty {
            width: 100%;
            height: 100%;
            position: relative;
        }

        #unity-progress-bar-full {
            position: absolute;
            top: 0;
            left: 0;
            width: 0%;
            height: 100%;
            background: #d7f34a;
            border-radius: 8px;
            transition: width 0.2s ease;
        }

        #unity-warning {
            position: absolute;
            left: 50%;
            top: 5%;
            transform: translate(-50%);
            background: white;
            padding: 10px;
            display: none;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
    </style>
</head>
<body>
   <div id="unity-container">
        <canvas id="unity-canvas" style="position: absolute; width: 100%; height: 100%"></canvas>
        <div id="unity-loading-bar">
            <div id="unity-logo">
                <img src="logo.png" alt="Granny Logo">
            </div>
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>
        <div id="unity-warning"></div>
    </div>
    <script>
        var container = document.querySelector("#unity-container");
        var canvas = document.querySelector("#unity-canvas");
        var loadingBar = document.querySelector("#unity-loading-bar");
        var progressBarFull = document.querySelector("#unity-progress-bar-full");
        var warningBanner = document.querySelector("#unity-warning");

        function unityShowBanner(msg, type) {
            function updateBannerVisibility() {
                warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
            }
            var div = document.createElement('div');
            div.innerHTML = msg;
            warningBanner.appendChild(div);
            if (type == 'error') div.style = 'background: red; padding: 10px;';
            else {
                if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
                setTimeout(function() {
                    warningBanner.removeChild(div);
                    updateBannerVisibility();
                }, 5000);
            }
            updateBannerVisibility();
        }

        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/Granny.loader.js";

        var config = {
            dataUrl: buildUrl + "/Granny.data",
            frameworkUrl: buildUrl + "/Granny.framework.js",
            codeUrl: buildUrl + "/Granny.wasm",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "Anastasia Kazantseva",
            productName: "Granny",
            productVersion: "1.0",
            showBanner: unityShowBanner,
        };

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = function () {
            createUnityInstance(canvas, config, function (progress) {
                progressBarFull.style.width = Math.round(100 * progress) + "%";
            }).then(function (unityInstance) {
                window.myGameInstance = unityInstance;
                loadingBar.style.display = "none";
            }).catch(function (message) {
                console.error("Granny instance error:", message);
                unityShowBanner(message, "error");
            });
        };
        document.body.appendChild(script);
    </script>
</body>
</html>
