<!DOCTYPE html>
<html>
  <head><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Lounge"><meta name="theme-color" content="#0d0f16"><link rel="icon" href="/brand/icon-32.png"><link rel="apple-touch-icon" href="/brand/icon-180.png">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Duck Life</title>
    <link rel="icon" type="image/x-icon" href="ducklife.png" />
    <link rel="shortcut icon" type="image/x-icon" href="ducklife.png" />
  </head>
  <body>
    
    <div id="ruffle" width="100%" height="100%"></div>
    <script src="ruffle.js"></script>
    <script>
      window.RufflePlayer = window.RufflePlayer || {};
      window.addEventListener("load", (event) => {
        const ruffle = window.RufflePlayer.newest();
        const player = ruffle.createPlayer();
        const container = document.getElementById("ruffle");
        player.id = "player";
        player.style.width = "100%";
        player.style.height = "100%";
        container.appendChild(player);
        player.load("dl1.swf");
      });
    </script>
  <script src="/gg/gg-boot.js"></script></body>
</html>
