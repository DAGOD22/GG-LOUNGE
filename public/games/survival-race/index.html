<!DOCTYPE html>
<!--
  Survival Race — local Unity WebGL build.
  Game files ship with the lounge in /games/survival-race/Build/ so the game runs
  without any external CDN. Provenance: the browser build of Survival Race as
  distributed in the UGS-Assets public asset stash (bubbls/UGS-Assets,
  "survival race v2"). The WebAssembly payload is stored as two parts (a hosting
  limit on large files); Build/merge.js reassembles them into one blob at runtime.
-->
<html lang="en-us" data-gg-game-state="ready">
  <head>
<script src="/customization-game.js"></script>
    <meta charset="utf-8">
    <meta name="robots" content="noindex, nofollow">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Survival Race</title>
    <style>
      html, body {
        background: #000;
        width: 100%;
        height: 100%;
        overflow: hidden;
        padding: 0;
        margin: 0;
      }
      div#gameContainer {
        background: transparent !important;
        position: absolute;
      }
      div#gameContainer canvas {
        position: absolute;
      }
      div#gameContainer canvas[data-pixel-art="true"] {
        image-rendering: pixelated;
      }
      /* Loading bar drawn on the canvas background until Unity takes over. */
      #unity-canvas { background: #000; }
      #gg-fallback {
        position: fixed; inset: 0; display: none;
        align-items: center; justify-content: center; text-align: center;
        background: #0b0d12; color: #f4f2ec;
        font: 16px/1.6 system-ui, sans-serif; padding: 24px; z-index: 99999;
      }
      #gg-fallback a { color: #d7f34a; }
      #gg-fallback code { background: #191d28; padding: 2px 6px; border-radius: 4px; }
    </style>
  </head>

  <body>
    <div id="gameContainer" style="width: 100%; height: 100%; top: 0px; left: 0px;">
      <canvas id="unity-canvas" data-pixel-art="" width="1094" height="615" style="width: 100%; height: 100%; cursor: default;"></canvas>
    </div>

    <div id="gg-fallback">
      <div>
        <h2 style="margin:0 0 8px">Survival Race could not start</h2>
        <p id="gg-fallback-detail" style="max-width: 46ch; margin: 0 auto"></p>
        <p style="font-size: 13px; opacity: .8">
          This build needs WebAssembly. If your browser or network blocks it, try
          another browser. Files live under <code>/games/survival-race/Build/</code>.
        </p>
      </div>
    </div>

    <script>
      // Yandex Games SDK hooks. The build calls these for ads/payments/leaderboards.
      // They are intentionally no-ops: the lounge does not serve ads or purchases.
      // (The lounge's own ad blocker also strips remote ad requests in the proxy.)
      var initGame = false, myGameInstance = null, ysdk = null, player = null;
      var leaderboard, payments = null, nowFullAdOpen = false;
      function InitGame() { initGame = true; }
      function FullAdShow() {}
      function RewardedShow(id) {}
      function StickyAdActivity(show) {}
      function InitPayments() {}
      function BuyPayments(id) {}
      function GetPayments() {}
      function ConsumePurchase(id) {}
      function ConsumePurchases() {}
      function InitLeaderboard() {}
      function SetLeaderboardScores(_name, score) {}
      function GetLeaderboardScores() {}
      function EntriesLB() {
        return { entries: 'no data', ranks: null, photos: [], names: [], scores: [], uniqueIDs: [] };
      }
      function Review() {}
      function PromptShow() {}
      function PaintRBT(rbt) {}
      function StaticRBTDeactivate() {}
      var cloudSaves = 'noData';
      function SaveCloud(jsonData, flush) {}
      function LoadCloud(sendback) {}
      var environmentData = 'null';
      function RequestingEnvironmentData(sendback) {}
      var playerData = 'noData';
      function InitPlayer(sendback) {}
      function NotAuthorized() {
        return JSON.stringify({
          playerAuth: 'rejected', playerName: 'unauthorized',
          playerId: 'unauthorized', playerPhoto: 'null'
        });
      }
      function OpenAuthDialog() {}

      var canvas = document.querySelector('#unity-canvas');

      function progressHandler(progress) {
        var percent = progress * 100 + '%';
        canvas.style.background =
          'linear-gradient(to right, #d7f34a, #d7f34a ' + percent + ', transparent ' + percent + ', transparent) no-repeat center';
        canvas.style.backgroundSize = '100% 0.5rem';
      }

      function onResize() {
        var w = window.innerWidth;
        var h = window.innerHeight;
        var container = canvas.parentElement;
        container.style.width = canvas.style.width = w + 'px';
        container.style.height = canvas.style.height = h + 'px';
        container.style.top = '0px';
        container.style.left = '0px';
      }
      window.addEventListener('resize', onResize);
      onResize();

      function fail(message) {
        console.error('[survival-race]', message);
        var box = document.getElementById('gg-fallback');
        document.getElementById('gg-fallback-detail').textContent = message;
        box.style.display = 'flex';
      }

      // ---- Reassemble the split WebAssembly payload, then boot Unity -----------
      // Build/merge.js exposes window.GGMergeWasm(); Build/yandexBrotli.loader.js
      // exposes createUnityInstance(). Both are loaded above this script.
      function bootUnity() {
        if (typeof createUnityInstance !== 'function') {
          fail('The Unity loader did not load. Check that /games/survival-race/Build/yandexBrotli.loader.js is reachable.');
          return;
        }
        window.GGMergeWasm('Build/yandexBrotli.wasm.unityweb', 2).then(function (wasmUrl) {
          var config = {
            dataUrl: 'Build/yandexBrotli.data.unityweb',
            frameworkUrl: 'Build/yandexBrotli.framework.js.unityweb',
            codeUrl: wasmUrl,
            streamingAssetsUrl: 'StreamingAssets',
            companyName: 'Survival',
            productName: 'Survival Race',
            productVersion: '0.0.15',
          };
          return createUnityInstance(canvas, config, progressHandler).then(function (instance) {
            myGameInstance = instance;
            canvas = instance.Module.canvas;
            canvas.style.background = 'transparent';
            onResize();
            if (typeof InitGame === 'function') InitGame();
          });
        }).catch(function (error) {
          fail('Could not load the game files: ' + (error && error.message ? error.message : error));
        });
      }
      if (document.readyState === 'complete') bootUnity();
      else window.addEventListener('load', bootUnity);
    </script>
    <script src="Build/merge.js"></script>
    <script src="Build/yandexBrotli.loader.js"></script>
  </body>
</html>
