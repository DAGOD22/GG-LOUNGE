<!DOCTYPE html>
<html lang="en">
<head>
<script src="/customization-game.js"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Five Nights at Freddy's</title>
    <link rel="icon" href="favicon.ico" />
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
        }

        #MMFCanvas {
            max-width: 100%;
            max-height: 100%;
            aspect-ratio: 16 / 9;
            display: block;
            background: #000;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
        }

        #fs-btn {
            position: fixed;
            top: 12px;
            right: 12px;
            background: rgba(20, 20, 20, 0.7);
            color: #d7f34a;
            border: 1px solid rgba(215, 243, 74, 0.4);
            border-radius: 8px;
            padding: 6px 12px;
            font-family: sans-serif;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            z-index: 100;
            backdrop-filter: blur(4px);
        }
        #fs-btn:hover {
            background: #d7f34a;
            color: #111;
        }
    </style>
</head>
<body>
    <button id="fs-btn" onclick="document.getElementById('MMFCanvas').requestFullscreen()">Fullscreen</button>
    <canvas id="MMFCanvas" width="1280" height="720">Your browser does not support Canvas.</canvas>
    <script src="src/Runtime.js"></script>
    <script>
        window.addEventListener('load', function () {
            try {
                new Runtime("MMFCanvas", "resources/FNAF1HTML5.cch");
            } catch (err) {
                console.error("FNAF runtime init failed:", err);
            }
        });
    </script>
</body>
</html>
