<!DOCTYPE html>
<html lang="en">
<head>
<meta name="gg-bg" content="on">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="referrer" content="no-referrer" />
<meta http-equiv="Referrer-Policy" content="no-referrer" />
<meta name="description" content="TikTok unblocked — the real feed and hashtag search, relayed through the lounge so school filters only see this site." />
<meta name="theme-color" content="#000" />
<title>TikTok Unblocked — GG Lounge</title>
<link rel="icon" href="/api/gg/icon.svg?label=T&amp;size=64" />
<style>
:root{
  --bg:#000; --panel:rgba(18,18,22,.9); --text:#f6f6f7; --muted:#a6a6ad; --line:rgba(255,255,255,.12);
  --cyan:#25f4ee; --red:#fe2c55; --chip:rgba(255,255,255,.1); --radius:14px; --bar-h:54px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
body{overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
input{font:inherit;color:inherit}
::-webkit-scrollbar{width:0;height:0}

/* ---------- shell ---------- */
.app{position:relative;height:100dvh;display:flex;flex-direction:column}
.topbar{position:fixed;top:0;left:0;right:0;z-index:40;height:var(--bar-h);display:flex;align-items:center;gap:10px;padding:0 12px;background:linear-gradient(180deg,rgba(0,0,0,.72),transparent)}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;letter-spacing:-.01em}
.brand svg{width:20px;height:20px}
.brand .unblocked{font-size:9px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:#000;background:var(--cyan);border-radius:5px;padding:2px 5px}
.tabs{display:flex;gap:4px;margin:0 auto;padding:3px;border-radius:99px;background:rgba(0,0,0,.4);border:1px solid var(--line)}
.tabs button{padding:6px 14px;border-radius:99px;font-size:13px;font-weight:700;color:var(--muted)}
.tabs button.active{background:rgba(255,255,255,.14);color:#fff}
.top-actions{display:flex;align-items:center;gap:6px}
.icon-btn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.35);border:1px solid var(--line)}
.icon-btn:hover{background:rgba(255,255,255,.14)}
.search-wrap{position:fixed;top:calc(var(--bar-h) + 4px);left:0;right:0;z-index:39;display:none;justify-content:center;padding:0 12px}
.search-wrap.open{display:flex}
.search-box{display:flex;width:min(520px,100%);gap:8px;padding:8px 10px;border-radius:99px;background:rgba(14,14,18,.94);border:1px solid var(--line);backdrop-filter:blur(10px)}
.search-box input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:14px}
.search-box button{padding:6px 14px;border-radius:99px;background:var(--red);color:#fff;font-weight:800;font-size:12.5px}

/* ---------- feed ---------- */
.feed{flex:1;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;-ms-overflow-style:none}
.feed::-webkit-scrollbar{display:none}
.slide{position:relative;height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;display:grid;place-items:center;background:#000}
.stage{position:relative;height:100%;aspect-ratio:9/16;max-width:100vw;background:#0a0a0c;overflow:hidden}
.stage video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
.poster{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(14px) brightness(.5);transform:scale(1.06)}
.poster.sharp{filter:none;transform:none;background-color:#000}
.scrim{position:absolute;inset:auto 0 0;height:46%;background:linear-gradient(transparent,rgba(0,0,0,.72))}
.center-play{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transition:opacity .18s;pointer-events:none}
.slide.paused .center-play{opacity:.85}
.center-play svg{width:62px;height:62px;filter:drop-shadow(0 6px 18px rgba(0,0,0,.6))}
.like-burst{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.4);opacity:0;pointer-events:none}
.like-burst.go{animation:burst .75s ease-out}
@keyframes burst{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}70%{opacity:1;transform:translate(-50%,-70%) scale(1)}100%{opacity:0;transform:translate(-50%,-110%) scale(.9)}}

.meta{position:absolute;left:0;right:74px;bottom:0;padding:0 16px 22px;z-index:3}
.meta .who{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px}
.meta .who .live{font-size:10px;background:var(--red);border-radius:5px;padding:2px 6px;letter-spacing:.1em}
.meta .cap{margin:7px 0 0;font-size:13.5px;line-height:1.45;color:#ececed;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta .cap.expanded{-webkit-line-clamp:12}
.meta .cap .tag{color:#fff;font-weight:800}
.meta .more{margin-left:6px;color:var(--muted);font-weight:800;font-size:12px}
.meta .music{display:flex;align-items:center;gap:7px;margin-top:9px;font-size:12px;color:#dcdce2;max-width:100%;overflow:hidden;white-space:nowrap}
.meta .music .spin{width:14px;height:14px;border-radius:50%;background:conic-gradient(var(--cyan),var(--red),var(--cyan));animation:spin 3.2s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(1turn)}}
.meta .music span{overflow:hidden;text-overflow:ellipsis}

.rail{position:absolute;right:8px;bottom:16px;display:flex;flex-direction:column;align-items:center;gap:15px;z-index:4}
.rail .avatar{position:relative;width:44px;height:44px;border-radius:50%;border:1.5px solid #fff;overflow:hidden;background:#222}
.rail .avatar img{width:100%;height:100%;object-fit:cover}
.rail .avatar .plus{position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);width:18px;height:18px;border-radius:50%;background:var(--red);display:grid;place-items:center;font-size:13px;font-weight:900;line-height:1}
.rail button{display:flex;flex-direction:column;align-items:center;gap:4px;color:#fff;font-size:12px;font-weight:800;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.rail button svg{width:31px;height:31px;transition:transform .18s}
.rail button:active svg{transform:scale(1.22)}
.rail button.on svg{color:var(--red);filter:drop-shadow(0 0 12px rgba(254,44,85,.6))}
.rail button.on.save svg{color:#ffd166;filter:none}

.bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.14);z-index:5}
.bar i{display:block;height:100%;width:0;background:#fff;transition:width .2s linear}

/* ---------- states ---------- */
.state{position:absolute;inset:0;display:grid;place-items:center;padding:26px;text-align:center}
.state .box{max-width:420px;display:flex;flex-direction:column;gap:12px;align-items:center}
.state h2{margin:0;font-size:19px}
.state p{margin:0;color:var(--muted);font-size:13px;line-height:1.6}
.state .row{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}
.btn{padding:10px 18px;border-radius:99px;background:#fff;color:#000;font-weight:900;font-size:13px}
.btn.ghost{background:rgba(255,255,255,.12);color:#fff}
.btn.liked{background:var(--red);color:#fff}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.18);border-top-color:#fff;animation:spin .85s linear infinite;margin:0 auto 12px}
.skeleton{width:min(100%,430px);height:100dvh;background:linear-gradient(160deg,#0c0c10,#15151b 46%,#0c0c10);position:relative}
#toasts{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{padding:10px 16px;border-radius:11px;background:rgba(246,246,247,.95);color:#000;font-size:12.5px;font-weight:800;box-shadow:0 10px 26px rgba(0,0,0,.5)}
.hint{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:20;display:flex;gap:14px;align-items:center;padding:8px 14px;border-radius:99px;background:rgba(10,10,12,.7);border:1px solid var(--line);font-size:11px;color:var(--muted);backdrop-filter:blur(8px)}
.hint b{color:#fff;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;padding:1px 5px;border-radius:5px;background:rgba(255,255,255,.12)}
@media(max-width:640px){.hint{display:none}.tabs{display:none}.stage{aspect-ratio:auto;width:100%}}
@media(min-aspect-ratio:1/1){.stage{height:100%;aspect-ratio:9/16}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <a class="brand" href="/" aria-label="GG Lounge home">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 3v11.2a4.1 4.1 0 1 1-4.1-4.1" stroke="#25f4ee" stroke-width="2" stroke-linecap="round"/><path d="M15 6.4A5.6 5.6 0 0 0 20.6 9.4V3.6A5.6 5.6 0 0 1 15 6.4z" fill="#fe2c55"/></svg>
      <span>TikTok</span>
      <span class="unblocked">unblocked</span>
    </a>
    <div class="tabs" role="tablist" aria-label="Feed">
      <button id="tab-foryou" class="active" role="tab" aria-selected="true">For You</button>
      <button id="tab-trending" role="tab" aria-selected="false">Trending</button>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="btn-search" aria-label="Search hashtags">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      </button>
      <button class="icon-btn" id="btn-sound" aria-label="Mute or unmute">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9h3l4-4v14l-4-4H4z"/><path d="M16 9.5a3.5 3.5 0 0 1 0 5"/><path d="M18.5 7a7 7 0 0 1 0 10"/></svg>
      </button>
      <button class="icon-btn" id="btn-reload" aria-label="Reload feed">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
      </button>
      <a class="icon-btn" href="/settings" aria-label="Lounge settings" title="Lounge settings">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></svg>
      </a>
    </div>
  </header>

  <div class="search-wrap" id="search-wrap">
    <form class="search-box" id="search-form">
      <input id="search-input" type="text" placeholder="Search a hashtag, sound or caption" autocomplete="off" spellcheck="false" aria-label="Search TikTok" />
      <button type="submit">Search</button>
    </form>
  </div>

  <div class="feed" id="feed" aria-label="TikTok feed"></div>

  <div class="hint" id="hint">
    <span><b>↑</b><b>↓</b> scroll</span>
    <span><b>Space</b> pause</span>
    <span><b>L</b> like</span>
    <span><b>M</b> mute</span>
    <span><b>/</b> search</span>
  </div>
</div>
<div id="toasts" aria-live="polite"></div>
<script src="/gg/gg-boot.js"></script>
<script src="./main.js"></script>
</body>
</html>
