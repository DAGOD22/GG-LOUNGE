<script>
/* GG Lounge CDN fallback: primary -> mirror -> mirror (for school networks that block a CDN) */
(function(){
  var SOURCES=[{base:"https://cdn.jsdelivr.net/gh/bubbls/subwaysurfersmerge/",extra:null,probe:"https://cdn.jsdelivr.net/gh/bubbls/subwaysurfersmerge/master-loader.js"},{base:"https://cdn.statically.io/gh/bubbls/subwaysurfersmerge/main/",extra:null,probe:"https://cdn.statically.io/gh/bubbls/subwaysurfersmerge/main/master-loader.js"},{base:"https://raw.githack.com/bubbls/subwaysurfersmerge/main/",extra:null,probe:"https://raw.githack.com/bubbls/subwaysurfersmerge/main/master-loader.js"}];
  var KEY="ggl_cdn_subway-surfers";
  function pick(){
    try{
      var q=new URLSearchParams(window.location.search).get("cdn");
      if(q!==null&&SOURCES[+q])return +q;
      var s=window.localStorage.getItem(KEY);
      if(s!==null&&SOURCES[+s])return +s;
    }catch(e){}
    return 0;
  }
  var idx=pick();
  window.GGL_CDN=SOURCES;window.GGL_CDN_IDX=idx;window.GGL_CDN_KEY=KEY;
  document.write('<base href="'+SOURCES[idx].base+'">');
})();
</script>

      <script type="text/javascript" src="4399.z.js"></script>
  <script>
        window.config = {
            loader: "unity",
            debug: false,
            maxRatio: 16 / 9,
            minRatio: 9 / 16,
            title: "Subway Surfers: San Francisco",
            unityVersion: "2019.4.18f1",
            unityWebglBuildUrl: "SanFrancisco.json",
            fileSize: 35,
            cachedDecompressedFileSizes: {
                "SanFrancisco.asm.code.unityweb": 9077143,
                "SanFrancisco.asm.framework.unityweb": 86369,
                "SanFrancisco.asm.memory.unityweb": 951447,
                "SanFrancisco.data.unityweb": 18323917,
                "SanFrancisco.wasm.code.unityweb": 7279617,
                "SanFrancisco.wasm.framework.unityweb": 90693,
            },
        }; 
        window.mergedBlobUrls = {};
        window.assetsReady = false;

        async function mergeSplitFile(fileUrlBase, numParts = 2) {
            const partUrls = Array.from({ length: numParts }, (_, i) => 
                `${fileUrlBase}.part${i + 1}`
            );

            try {
                const responses = await Promise.all(
                    partUrls.map(url => fetch(url))
                );

                if (responses.some(r => !r.ok)) {
                    return null;
                }

                const parts = await Promise.all(
                    responses.map(r => r.arrayBuffer())
                );

                const combinedBlob = new Blob(parts, {
                    type: 'application/octet-stream'
                });

                return URL.createObjectURL(combinedBlob);
            } catch (error) {
                return null;
            }
        }

        function setupXHRInterceptor() {
            if (window.xhrInterceptorInstalled) {
                return;
            }
            
            const originalOpen = XMLHttpRequest.prototype.open;
            const originalSend = XMLHttpRequest.prototype.send;

            XMLHttpRequest.prototype.open = function(method, url, ...args) {
                this._url = url;
                this._method = method;
                this._args = args;
                
                let finalUrl = url;
                for (const [filename, blobUrl] of Object.entries(window.mergedBlobUrls)) {
                    if (url.includes(filename)) {
                        finalUrl = blobUrl;
                        break;
                    }
                }
                
                return originalOpen.call(this, method, finalUrl, ...args);
            };

            XMLHttpRequest.prototype.send = function(...args) {
                const xhr = this;
                
                if (!window.assetsReady) {
                    const checkReady = setInterval(() => { 
                        if (window.assetsReady) {
                            clearInterval(checkReady);
                            originalSend.apply(xhr, args);
                        }
                    }, 50);
                    return;
                }
                
                return originalSend.apply(this, args);
            };
            
            window.xhrInterceptorInstalled = true;
        }

        async function prepareGameAssets() {
            try {
                window.assetsReady = false;
                delete window.xhrInterceptorInstalled;
                window.mergedBlobUrls = {};
                
                setupXHRInterceptor();
                
                const filesToMerge = [
                    'SanFrancisco.data.unityweb',
                    'SanFrancisco.wasm.code.unityweb'
                ];
                 
                for (const filename of filesToMerge) {
                    const blobUrl = await mergeSplitFile(filename, 2);
                    if (blobUrl) {
                        window.mergedBlobUrls[filename] = blobUrl;
                    } 
                }
                
                window.assetsPrepared = true;
                window.assetsReady = true;
                
            } catch (error) {
                window.assetsPrepared = false;
                window.assetsReady = true;
            }
        }

        prepareGameAssets();

    </script>

<body>
    <script src="master-loader.js"></script>
<script>
(function(){
  if(!window.GGL_CDN)return;
  var S=window.GGL_CDN,KEY=window.GGL_CDN_KEY,idx=window.GGL_CDN_IDX;
  var order=[idx];for(var k=0;k<S.length;k++){if(k!==idx)order.push(k);}
  function fail(){
    var d=document.createElement("div");
    d.style.cssText="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b0d12;color:#f4f2ec;font-family:Arial,sans-serif;z-index:99999;text-align:center;padding:24px";
    d.innerHTML="<div><h2>Game files blocked on this network</h2><p>All download mirrors failed. Try again later or on another network.</p></div>";
    document.body.appendChild(d);
  }
  function attempt(n){
    if(n>=order.length){fail();return;}
    var i=order[n];
    fetch(S[i].probe,{method:"HEAD",mode:"cors",cache:"no-store"}).then(function(r){
      if(r&&(r.ok||r.status===405||r.status===403)){
        try{localStorage.setItem(KEY,String(i));}catch(e){}
        if(i!==idx){var u=new URL(window.location.href);u.searchParams.set("cdn",String(i));window.location.replace(u.toString());}
      }else{attempt(n+1);}
    }).catch(function(){attempt(n+1);});
  }
  attempt(0);
})();
</script>
