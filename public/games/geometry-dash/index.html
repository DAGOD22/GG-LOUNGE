        <script>
            var gameInstance = UnityLoader.instantiate("gameContainer", "Build/GeometryDashLite.json", {
                onProgress: UnityProgress
            });

            function UnityProgress(gameInstance, progress) {
                if (!gameInstance.Module) {
                    return;
                }
                const loader = document.querySelector("#loader");
                if (!gameInstance.progress) {
                    const progress = document.querySelector("#loader .progress");
                    progress.style.display = "block";
                    gameInstance.progress = progress.querySelector(".full");
                    loader.querySelector(".spinner").style.display = "none";
                }
                gameInstance.progress.style.transform = `scaleX(${progress})`;
                if (progress === 1 && !gameInstance.removeTimeout) {
                    gameInstance.removeTimeout = setTimeout(function() {
                        loader.style.display = "none";
                    }, 2000);
                }
            }
        </script>

<script>
(function(){
  if(!window.GGL_CDN)return;
  var S=window.GGL_CDN,KEY=window.GGL_CDN_KEY,idx=window.GGL_CDN_IDX;
  var order=[idx];for(var k=0;k<S.length;k++){if(k!==idx)order.push(k);}
  function fail(){
    var d=document.createElement("div");
    d.style.cssText="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b0d12;color:#f4f2ec;font-family:Arial,sans-serif;z-index:99999;text-align:center;padding:24px";
    d.innerHTML="<div><h2>Game files blocked on this network</h2><p>All download mirrors failed. Try again later or on another network.</p></div>";
    document.body.appendChild(d);
  }
  function attempt(n){
    if(n>=order.length){fail();return;}
    var i=order[n];
    fetch(S[i].probe,{method:"HEAD",mode:"cors",cache:"no-store"}).then(function(r){
      if(r&&(r.ok||r.status===405||r.status===403)){
        try{localStorage.setItem(KEY,String(i));}catch(e){}
        if(i!==idx){var u=new URL(window.location.href);u.searchParams.set("cdn",String(i));window.location.replace(u.toString());}
      }else{attempt(n+1);}
    }).catch(function(){attempt(n+1);});
  }
  attempt(0);
})();
</script>
