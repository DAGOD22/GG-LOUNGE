<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GG-Lounge YouTube</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0f1014;color:#f5f5f5;font:16px system-ui,sans-serif;display:grid;place-items:center;padding:24px}.app{width:min(980px,100%)}h1{color:#ff4d5f;text-align:center;font-size:clamp(28px,5vw,48px);margin:0 0 24px}.search{display:flex;gap:10px;margin-bottom:24px}.search input{flex:1;min-width:0;border:1px solid #3b3e47;background:#1b1d24;color:inherit;border-radius:999px;padding:14px 18px;font-size:16px}.search button{border:0;border-radius:999px;padding:0 24px;background:#ff4d5f;color:#fff;font-weight:700;cursor:pointer}.player{aspect-ratio:16/9;background:#050505;border:1px solid #30323a;border-radius:16px;overflow:hidden;box-shadow:0 18px 50px #0008}.player iframe{width:100%;height:100%;border:0}.hint{text-align:center;color:#9599a6;margin-top:12px;font-size:14px}
  </style>
</head>
<body>
  <main class="app">
    <h1>YouTube Lounge</h1>
    <form class="search" id="form"><input id="url" placeholder="Paste a youtube.com or youtu.be link" aria-label="YouTube URL"><button>Load video</button></form>
    <section class="player"><iframe id="player" title="YouTube video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></section>
    <p class="hint" id="status">Uses YouTube's official privacy-enhanced embed player. No proxy or network bypass.</p>
  </main>
  <script>
    const form=document.getElementById('form'),input=document.getElementById('url'),player=document.getElementById('player'),status=document.getElementById('status');
    function videoId(value){try{const url=new URL(value);if(url.hostname==='youtu.be')return url.pathname.slice(1).split('/')[0];if(url.hostname.endsWith('youtube.com'))return url.searchParams.get('v')||url.pathname.split('/').filter(Boolean).pop()}catch{}return /^[\w-]{11}$/.test(value)?value:null}
    form.addEventListener('submit',e=>{e.preventDefault();const id=videoId(input.value.trim());if(!id){status.textContent='Enter a valid YouTube video URL or 11-character video ID.';return}player.src='https://www.youtube-nocookie.com/embed/'+encodeURIComponent(id)+'?autoplay=1&rel=0';status.textContent='Loaded through YouTube privacy-enhanced embed.'});
  </script>
</body>
</html>
