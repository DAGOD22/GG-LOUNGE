<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="referrer" content="no-referrer" />
<meta http-equiv="Referrer-Policy" content="no-referrer" />
<meta name="description" content="Unblocked YouTube lounge — search, trending and watch with no ads. Works on school networks." />
<meta name="theme-color" content="#0f0f0f" />
<link rel="icon" type="image/svg+xml" href="./icon.svg" />
<link rel="manifest" href="./manifest.json" />
<title>YouTube Unblocked — GG Lounge</title>
<style>
:root{
  --bg:#0f0f0f; --bg-soft:#171717; --bg-card:#1d1d1f; --bg-hover:#2a2a2c;
  --line:rgba(255,255,255,.09); --text:#f1f1f1; --muted:#aaa; --dim:#717171;
  --red:#ff0033; --red-dark:#c00; --chip:#272727; --accent:#3ea6ff;
  --green:#2ecc71; --yellow:#f1c40f;
  --radius:12px; --topbar-h:60px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:Roboto,Arial,Helvetica,system-ui,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:var(--text)}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#4d4d4d;border-radius:8px}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;height:var(--topbar-h);padding:0 16px;background:rgba(15,15,15,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;flex:0 0 auto;user-select:none}
.brand-mark{width:32px;height:22px;border-radius:6px;background:var(--red);display:grid;place-items:center;box-shadow:0 0 18px rgba(255,0,51,.35)}
.brand-mark svg{display:block}
.brand-name{font-size:17px;font-weight:700;letter-spacing:-.02em}
.brand-badge{font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#0f0f0f;background:var(--green);border-radius:4px;padding:2px 5px;margin-left:2px}
.search-zone{flex:1;display:flex;justify-content:center;min-width:0}
.search-box{position:relative;display:flex;width:min(640px,100%)}
.search-box input{flex:1;min-width:0;height:40px;padding:0 16px;background:#121212;border:1px solid #3d3d3d;border-right:0;border-radius:20px 0 0 20px;outline:none;font-size:15px}
.search-box input:focus{border-color:#1c62b9;box-shadow:inset 0 0 0 1px #1c62b9}
.search-btn{width:64px;height:40px;background:var(--chip);border:1px solid #3d3d3d;border-radius:0 20px 20px 0;display:grid;place-items:center}
.search-btn:hover{background:#3d3d3d}
.suggest{position:absolute;top:44px;left:0;right:64px;background:#212121;border-radius:12px;padding:8px 0;box-shadow:0 12px 32px rgba(0,0,0,.6);display:none;max-height:320px;overflow:auto}
.suggest.open{display:block}
.suggest button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:9px 16px;font-size:15px}
.suggest button:hover,.suggest button.active{background:#3d3d3d}
.top-actions{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.net-dot{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:6px 11px;white-space:nowrap}
.net-dot i{width:8px;height:8px;border-radius:50%;background:var(--yellow);flex:0 0 auto}
.net-dot.ok i{background:var(--green);box-shadow:0 0 8px var(--green)}
.net-dot.bad i{background:var(--red)}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center}
.icon-btn:hover{background:var(--bg-hover)}

/* ---------- layout ---------- */
.shell{display:flex;min-height:calc(100vh - var(--topbar-h))}
.sidebar{width:216px;flex:0 0 auto;padding:12px;border-right:1px solid var(--line);position:sticky;top:var(--topbar-h);height:calc(100vh - var(--topbar-h));overflow:auto}
.nav-item{display:flex;align-items:center;gap:16px;width:100%;padding:10px 12px;border-radius:10px;font-size:14px;color:var(--text)}
.nav-item svg{flex:0 0 auto;opacity:.9}
.nav-item:hover{background:var(--bg-hover)}
.nav-item.active{background:var(--bg-hover);font-weight:600}
.nav-sep{height:1px;background:var(--line);margin:10px 4px}
.nav-note{padding:8px 12px;color:var(--dim);font-size:11px;line-height:1.5}
.main{flex:1;min-width:0;padding:20px 24px 60px}
.view-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 16px}
.view-head h1{margin:0;font-size:20px;letter-spacing:-.01em}
.region-select{background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px}

/* ---------- video grid ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px 16px}
.card{cursor:pointer;border-radius:var(--radius);overflow:hidden}
.card:hover{background:var(--bg-soft)}
.thumb{position:relative;aspect-ratio:16/9;background:#000;border-radius:var(--radius);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;background:#1c1c1c}
.thumb img.broken{display:none}
.badge-dur{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.85);font-size:12px;font-weight:500;border-radius:4px;padding:1px 5px}
.badge-live{position:absolute;right:6px;bottom:6px;background:var(--red-dark);font-size:11px;font-weight:700;border-radius:4px;padding:2px 6px}
.card-row{display:flex;gap:12px;padding:10px 4px 14px}
.avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--chip);flex:0 0 auto}
.card-meta{min-width:0}
.card-title{font-size:14px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:0 0 4px}
.card-sub{color:var(--muted);font-size:12px}
.card-sub .verified{color:var(--muted)}

/* ---------- list rows (search) ---------- */
.rows{display:flex;flex-direction:column;gap:18px;max-width:1100px}
.row{display:flex;gap:16px;cursor:pointer;border-radius:var(--radius);padding:6px}
.row:hover{background:var(--bg-soft)}
.row .thumb{width:min(420px,42%);flex:0 0 auto}
.row-body{min-width:0;padding:4px 0}
.row-title{font-size:16px;font-weight:600;margin:0 0 6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row-sub{color:var(--muted);font-size:12px;margin-bottom:8px}
.row-desc{color:var(--muted);font-size:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.filter-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.filter-tabs button{padding:7px 14px;border-radius:8px;background:var(--chip);font-size:13px}
.filter-tabs button.active{background:#f1f1f1;color:#0f0f0f;font-weight:600}
.channel-row{display:flex;align-items:center;gap:16px;padding:10px 6px;border-radius:var(--radius);cursor:pointer}
.channel-row:hover{background:var(--bg-soft)}
.channel-row img{width:64px;height:64px;border-radius:50%;object-fit:cover}

/* ---------- watch ---------- */
.watch{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;align-items:start}
.player-wrap{position:sticky;top:calc(var(--topbar-h) + 12px)}
.watch .player-col{min-width:0}
video.player{width:100%;aspect-ratio:16/9;background:#000;border-radius:var(--radius);display:block}
.player-fallback{aspect-ratio:16/9;display:grid;place-items:center;background:#000;border-radius:var(--radius);color:var(--muted);text-align:center;padding:24px}.player.official{border:0}.player-fallback.official-wrap{aspect-ratio:auto;margin-top:10px}.player-fallback .btn{margin-top:6px;cursor:pointer;border:0}.official-note{color:var(--muted);font-size:13px;margin:12px 2px 0}.btn-row .btn{cursor:pointer}
.watch-title{font-size:18px;font-weight:700;margin:14px 0 8px;line-height:1.35}
.watch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.channel-chip{display:flex;align-items:center;gap:12px;cursor:pointer;border-radius:10px;padding:4px 8px 4px 4px}
.channel-chip:hover{background:var(--bg-soft)}
.channel-chip img{width:40px;height:40px;border-radius:50%;object-fit:cover;background:var(--chip)}
.channel-chip .name{font-weight:600;font-size:14px}
.channel-chip .subs{color:var(--muted);font-size:12px}
.watch-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:7px;background:var(--chip);border-radius:18px;padding:8px 14px;font-size:13px;font-weight:600}
.pill:hover{background:#3d3d3d}
.pill.on{background:#f1f1f1;color:#0f0f0f}
select.pill{appearance:none;-webkit-appearance:none;padding-right:12px}
select.pill option{background:#212121;color:#f1f1f1}
.desc{background:var(--bg-soft);border-radius:var(--radius);padding:12px 14px;margin-top:14px;font-size:13px;white-space:pre-wrap;word-break:break-word}
.desc .desc-meta{font-weight:600;margin-bottom:6px}
.desc .desc-text{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.desc.expanded .desc-text{display:block}
.desc-toggle{color:var(--muted);font-weight:600;margin-top:6px;padding:0}
.desc a{color:var(--accent)}
.upnext h2{font-size:15px;margin:0 0 12px}
.mini{display:flex;gap:10px;cursor:pointer;border-radius:10px;padding:4px}
.mini:hover{background:var(--bg-soft)}
.mini .thumb{width:168px;flex:0 0 auto;border-radius:8px}
.mini-title{font-size:13px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:0 0 4px}
.mini-sub{color:var(--muted);font-size:11px}
.comments{margin-top:26px}
.comments h2{font-size:15px;margin:0 0 16px}
.comment{display:flex;gap:12px;margin-bottom:18px}
.comment img{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--chip);flex:0 0 auto}
.comment-head{font-size:12px;margin-bottom:3px}
.comment-head b{font-size:12px}
.comment-head span{color:var(--muted);margin-left:8px}
.comment-body{font-size:13px;white-space:pre-wrap;word-break:break-word}
.comment-likes{color:var(--muted);font-size:12px;margin-top:5px}
.load-more{display:block;margin:18px auto 0;padding:10px 22px;border:1px solid var(--line);border-radius:20px;font-size:13px;font-weight:600}
.load-more:hover{background:var(--bg-hover)}

/* ---------- channel page ---------- */
.chan-banner{height:140px;border-radius:var(--radius);background:linear-gradient(120deg,#3a0d16,#5c1030 40%,#1d1d3f);background-size:cover;background-position:center;margin-bottom:16px}
.chan-head{display:flex;align-items:center;gap:16px;margin-bottom:8px}
.chan-head img{width:80px;height:80px;border-radius:50%;object-fit:cover;background:var(--chip)}
.chan-head h1{margin:0;font-size:22px}
.chan-head .subs{color:var(--muted);font-size:13px}

/* ---------- settings ---------- */
.settings{max-width:640px;display:flex;flex-direction:column;gap:14px}
.set-card{background:var(--bg-soft);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.set-card h2{margin:0 0 4px;font-size:15px}
.set-card p{margin:0 0 12px;color:var(--muted);font-size:13px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.set-row:first-of-type{border-top:0}
.set-row label{font-size:13px;font-weight:600}
.set-row small{display:block;color:var(--muted);font-weight:400;margin-top:2px}
.switch{position:relative;width:44px;height:24px;flex:0 0 auto}
.switch input{opacity:0;width:100%;height:100%;position:absolute;margin:0;cursor:pointer}
.switch i{position:absolute;inset:0;background:#3d3d3d;border-radius:99px;transition:.2s;pointer-events:none}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked + i{background:var(--accent)}
.switch input:checked + i::after{left:23px}
.set-select{background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px;max-width:240px}
.danger{color:#ff8080;border:1px solid rgba(255,0,51,.4);border-radius:10px;padding:9px 16px;font-size:13px;font-weight:600}
.danger:hover{background:rgba(255,0,51,.12)}

/* ---------- states ---------- */
.skeleton{border-radius:var(--radius);overflow:hidden}
.skel-thumb{aspect-ratio:16/9;background:linear-gradient(100deg,#1c1c1c 40%,#2a2a2a 50%,#1c1c1c 60%);background-size:200% 100%;animation:shimmer 1.2s infinite}
.skel-line{height:12px;margin:10px 4px;border-radius:6px;background:linear-gradient(100deg,#1c1c1c 40%,#2a2a2a 50%,#1c1c1c 60%);background-size:200% 100%;animation:shimmer 1.2s infinite}
@keyframes shimmer{to{background-position:-200% 0}}
.error-box{max-width:560px;margin:60px auto;text-align:center;padding:32px 24px;background:var(--bg-soft);border:1px solid var(--line);border-radius:16px}
.error-box h2{margin:0 0 8px;font-size:18px}
.error-box p{color:var(--muted);font-size:13px;margin:0 0 16px;word-break:break-word}
.error-box .btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{background:#f1f1f1;color:#0f0f0f;font-weight:700;border-radius:20px;padding:10px 20px;font-size:13px}
.btn.ghost{background:var(--chip);color:var(--text)}
.empty{color:var(--muted);text-align:center;padding:60px 20px;font-size:14px}
#toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:#f1f1f1;color:#0f0f0f;font-size:13px;font-weight:600;border-radius:10px;padding:11px 18px;box-shadow:0 8px 24px rgba(0,0,0,.5);animation:toast-in .25s ease}
@keyframes toast-in{from{opacity:0;transform:translateY(8px)}}
.skipper{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.8);font-size:12px;font-weight:600;border-radius:6px;padding:5px 10px;display:none}
.player-holder{position:relative}

/* ---------- responsive ---------- */
@media (max-width:1100px){.watch{grid-template-columns:minmax(0,1fr)}.upnext{margin-top:8px}.player-wrap{position:static}}
@media (max-width:820px){
  .sidebar{display:none}
  .main{padding:14px 12px 60px}
  .brand-name{display:none}
  .net-dot span{display:none}
  .row{flex-direction:column}
  .row .thumb{width:100%}
  .grid{grid-template-columns:1fr}
  .topbar{padding:0 10px;gap:8px}
  .search-btn{width:48px}
  .suggest{right:48px}
}
.mobilenav{display:none}
@media (max-width:820px){
  .mobilenav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:60;background:rgba(15,15,15,.97);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .mobilenav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--muted);padding:6px 0;border-radius:8px}
  .mobilenav button.active{color:var(--text)}
}
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="./index.html" id="brand-home" aria-label="YouTube Unblocked home">
    <span class="brand-mark" aria-hidden="true">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg>
    </span>
    <span class="brand-name">YouTube</span>
    <span class="brand-badge">Unblocked</span>
  </a>
  <div class="search-zone">
    <div class="search-box">
      <input id="search-input" type="text" placeholder="Search" autocomplete="off" spellcheck="false" aria-label="Search videos" />
      <button class="search-btn" id="search-btn" aria-label="Search">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#f1f1f1" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      </button>
      <div class="suggest" id="suggest" role="listbox" aria-label="Search suggestions"></div>
    </div>
  </div>
  <div class="top-actions">
    <div class="net-dot" id="net-dot" title="Video network status"><i></i><span id="net-text">Connecting…</span></div>
    <button class="icon-btn" id="settings-btn" aria-label="Settings" title="Settings">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>
</header>

<div class="shell">
  <nav class="sidebar" aria-label="Library">
    <button class="nav-item active" data-nav="home">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
      Home
    </button>
    <button class="nav-item" data-nav="trending">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>
      Trending
    </button>
    <button class="nav-item" data-nav="history">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
      History
    </button>
    <button class="nav-item" data-nav="later">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      Watch Later
    </button>
    <div class="nav-sep"></div>
    <button class="nav-item" data-nav="settings">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></svg>
      Settings
    </button>
    <div class="nav-sep"></div>
    <p class="nav-note">No ads. No Google login. No youtube.com — everything loads through unblocked video servers.<br /><br />GG Lounge video room</p>
  </nav>

  <main class="main" id="main" tabindex="-1"></main>
</div>

<nav class="mobilenav" aria-label="Library">
  <button data-nav="home" class="active">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
    Home
  </button>
  <button data-nav="trending">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>
    Trending
  </button>
  <button data-nav="history">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
    History
  </button>
  <button data-nav="later">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
    Saved
  </button>
  <button data-nav="settings">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></svg>
    Settings
  </button>
</nav>

<div id="toasts" aria-live="polite"></div>
<script src="./main.js"></script>
</body>
</html>
