<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>植物大战僵尸 - Plants vs Zombies</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        #gameContainer {
            position: relative;
            width: 1400px;
            height: 600px;
            box-shadow: 0 0 50px rgba(0, 255, 0, 0.3);
            border-radius: 10px;
            overflow: auto; /* 允许滚动 */
        }

        #gameCanvas {
            display: block;
            background: #2d5a27;
            cursor: crosshair;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* 动画精灵层 - 使用DOM元素显示GIF动画 */
        #spriteLayer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        .sprite {
            position: absolute;
            pointer-events: none;
            image-rendering: auto;
        }

        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            pointer-events: none;
            z-index: 10;
        }

        #sunCounter {
            position: absolute;
            top: 73px;
            left: 472px;
            color: #000000;
            font-size: 20px;
            font-weight: bold;
            text-shadow: none;
            z-index: 100;
            display: none;
        }

        #levelInfo {
            position: absolute;
            top: 10px;
            right: 20px;
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            z-index: 100;
        }

        #message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffffff;
            font-size: 48px;
            font-weight: bold;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.9);
            z-index: 1000;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s;
        }

        #message.show {
            opacity: 1;
        }

        #startScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        #startScreen h1 {
            color: #4CAF50;
            font-size: 64px;
            margin-bottom: 40px;
            text-shadow: 4px 4px 8px rgba(0, 0, 0, 0.8);
        }

        #startButton {
            padding: 20px 60px;
            font-size: 28px;
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.4);
            pointer-events: auto;
        }

        #startButton:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(76, 175, 80, 0.6);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="spriteLayer"></div>
        <div id="ui">
            <div id="sunCounter"><span id="sunAmount">150</span></div>
            <div id="levelInfo">波次: <span id="waveNumber">1</span></div>
        </div>
        <div id="message"></div>
        <div id="startScreen">
            <h1>🌻 植物大战僵尸 🧟</h1>
            <button id="startButton">开始游戏</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
