<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Merge Reactor</title>
<style>
  html,body{margin:0;height:100%;background:#07090e;overflow:hidden;
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#e8edf4;
    -webkit-tap-highlight-color:transparent}
  #stage{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
  .hud{position:fixed;left:14px;top:12px;pointer-events:none;font:800 12px/1.4 ui-monospace,SFMono-Regular,monospace;
    letter-spacing:.08em;color:#bef264;text-shadow:0 2px 14px rgba(0,0,0,.7)}
  .hud small{display:block;font-size:10px;letter-spacing:.14em;opacity:.55;color:#e8edf4;margin-top:3px}
  .overlay{position:fixed;inset:0;display:grid;place-items:center;background:rgba(5,7,11,.82);
    backdrop-filter:blur(6px);text-align:center;padding:24px;z-index:5}
  .overlay[hidden]{display:none}
  .card{max-width:360px}
  .card h1{margin:0 0 6px;font-size:26px;letter-spacing:-.03em}
  .card p{margin:0 0 16px;font-size:13.5px;line-height:1.6;color:#a9b4c4}
  .card .stat{font:800 40px/1 ui-monospace,monospace;color:#bef264;margin:10px 0 4px}
  .keys{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:14px 0 18px}
  .keys span{font:800 10.5px/1 ui-monospace,monospace;letter-spacing:.06em;padding:6px 9px;border-radius:8px;
    border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);color:#cbd5e1}
  button{appearance:none;border:0;background:#bef264;color:#0b0d12;font:900 13px/1 inherit;
    padding:12px 22px;border-radius:11px;cursor:pointer;letter-spacing:.02em}
  button.ghost{background:transparent;color:#e8edf4;border:1px solid rgba(255,255,255,.18);margin-left:8px}
  .foot{position:fixed;right:14px;bottom:12px;font:700 10px/1 ui-monospace,monospace;
    letter-spacing:.14em;color:rgba(232,237,244,.32);pointer-events:none}
</style>
</head>
<body>
<div id="stage"></div>
<div class="hud" id="hud"></div>
<div class="overlay" id="intro">
  <div class="card">
    <h1>Merge Reactor</h1>
    <p>Drop cells into the reactor and let identical tiers snap together. A tier-8 cell clears its column — but a hot core ends the run.</p>
    <div class="keys"><span>CLICK / 1-5</span>
    <span>DROP</span>
    <span>SAME TIERS</span>
    <span>MERGE</span>
    <span>HEAT</span>
    <span>KEEP IT COOL</span></div>
    <button id="go">Play</button>
    <button class="ghost" id="mute" aria-pressed="false">Sound on</button>
  </div>
</div>
<div class="overlay" id="over" hidden>
  <div class="card">
    <p id="overwhy">Run over.</p>
    <div class="stat" id="score">0</div>
    <p id="best" style="margin:0"></p>
    <div style="margin-top:18px">
      <button id="again">Again</button>
    </div>
  </div>
</div>
<div class="foot">GG-LOUNGE ORIGINALS</div>
<script src="../_shared/gg-arcade.js"></script>
<script>/* Merge Reactor — snap same-tier cells together, keep the core cool. */
(function () {
  'use strict';
  var view = GGA.createCanvas(document.getElementById('stage'));
  var ctx = view.ctx;
  var hud = document.getElementById('hud');
  var intro = document.getElementById('intro');
  var over = document.getElementById('over');
  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var whyEl = document.getElementById('overwhy');

  var COLS = 5, ROWS = 5;
  var TIERS = [
    { colour: '#3f4a5c', label: '1' }, { colour: '#7dd3ff', label: '2' },
    { colour: '#6ee7b7', label: '3' }, { colour: '#bef264', label: '4' },
    { colour: '#fde68a', label: '5' }, { colour: '#fdba74', label: '6' },
    { colour: '#f0abfc', label: '7' }, { colour: '#ff7a7a', label: '8' }
  ];

  var state = 'intro';
  var grid, heat, score, moves, best, spawnAt, spin, pops;

  best = GGA.store('best', 0) || 0;

  function reset() {
    grid = [];
    for (var y = 0; y < ROWS; y++) grid.push(new Array(COLS).fill(0));
    heat = 0;
    score = 0;
    moves = 0;
    spawnAt = 0;
    spin = 0;
    pops = [];
    // Start with three tier-1 cells so the first move is a merge, not a wait.
    for (var i = 0; i < 3; i++) spawn();
  }

  function spawn() {
    var empties = [];
    for (var y = 0; y < ROWS; y++) for (var x = 0; x < COLS; x++) if (!grid[y][x]) empties.push([x, y]);
    if (!empties.length) return false;
    var pick = empties[GGA.randInt(0, empties.length - 1)];
    // A new cell is tier 1 or 2, weighted; dropping tier 3s early makes the
    // board unreadable before the player has learned the rule.
    grid[pick[1]][pick[0]] = Math.random() < 0.82 ? 1 : 2;
    return true;
  }

  function pop(x, y, tier) {
    pops.push({ x: x, y: y, tier: tier, a: 1 });
  }

  /** One gravity step: every cell falls as far as it can. */
  function settle() {
    var moved = false;
    for (var x = 0; x < COLS; x++) {
      var write = ROWS - 1;
      for (var y = ROWS - 1; y >= 0; y--) {
        if (!grid[y][x]) continue;
        if (write !== y) {
          grid[write][x] = grid[y][x];
          grid[y][x] = 0;
          moved = true;
        }
        write--;
      }
    }
    return moved;
  }

  /** Merge vertically adjacent equal tiers, cascading until stable. */
  function mergePass() {
    var merged = false;
    for (var x = 0; x < COLS; x++) {
      for (var y = ROWS - 1; y > 0; y--) {
        var current = grid[y][x];
        if (!current) continue;
        if (grid[y - 1][x] === current && current < TIERS.length) {
          grid[y - 1][x] = current + 1;
          grid[y][x] = 0;
          score += current * current * 10;
          pop(x, y - 1, current + 1);
          merged = true;
          if (current + 1 >= TIERS.length) {
            // A tier-8 cell is the win condition, and it clears the column it
            // sits in — the reward for getting that high is board space.
            score += 500;
            for (var c = 0; c < ROWS; c++) grid[c][x] = 0;
            heat = Math.max(0, heat - 25);
          }
        }
      }
    }
    if (merged) {
      settle();
      mergePass();
    }
    return merged;
  }

  function dropColumn(col) {
    if (state !== 'play') return;
    var empty = -1;
    for (var y = 0; y < ROWS; y++) if (!grid[y][col]) { empty = y; break; }
    if (empty === -1) return;
    grid[empty][col] = 1;
    moves++;
    heat = Math.min(100, heat + 1.6);
    var before = score;
    settle();
    mergePass();
    if (score === before) heat = Math.min(100, heat + 1.4);
    if (!spawn()) { /* full board handled below */ }
    if (grid[0].every(function (cell) { return cell > 0; })) end('The reactor filled up.');
  }

  function end(reason) {
    state = 'dead';
    whyEl.textContent = reason;
    scoreEl.textContent = score;
    if (score > best) { best = score; GGA.store('best', best); }
    bestEl.textContent = 'Best ' + best;
    over.hidden = false;
  }

  view.canvas.addEventListener('pointerdown', function (event) {
    var box = view.canvas.getBoundingClientRect();
    var layout = computeLayout();
    var x = event.clientX - box.left - layout.ox;
    if (x < 0 || x > layout.cell * COLS) return;
    dropColumn(Math.max(0, Math.min(COLS - 1, Math.floor(x / layout.cell))));
  });
  window.addEventListener('keydown', function (event) {
    var n = Number(event.key);
    if (n >= 1 && n <= COLS) dropColumn(n - 1);
  });

  function computeLayout() {
    var cell = Math.floor(Math.min((view.size.w * 0.7) / COLS, (view.size.h * 0.82) / ROWS));
    return {
      cell: cell,
      ox: Math.round((view.size.w - cell * COLS) / 2),
      oy: Math.round((view.size.h - cell * ROWS) / 2)
    };
  }

  function update(dt) {
    spin += dt;
    if (state !== 'play') return;
    // The core cools slowly on its own; a cold reactor scores, a hot one ends.
    heat = Math.max(0, heat - dt * 2.2);
    if (heat >= 100) end('The reactor overheated — you were dropping too fast.');
    for (var i = pops.length - 1; i >= 0; i--) {
      pops[i].a -= dt * 1.4;
      if (pops[i].a <= 0) pops.splice(i, 1);
    }
    hud.innerHTML = score + ' pts<small>' + Math.round(heat) + '% HEAT · ' + moves + ' DROPS</small>';
  }

  function draw() {
    var w = view.size.w, h = view.size.h;
    ctx.fillStyle = '#07090e';
    ctx.fillRect(0, 0, w, h);
    GGA.grid(ctx, w, h, spin * 8, 58, 'rgba(125,211,255,.05)');

    var layout = computeLayout();
    for (var y = 0; y < ROWS; y++) {
      for (var x = 0; x < COLS; x++) {
        var cx = layout.ox + x * layout.cell;
        var cy = layout.oy + y * layout.cell;
        ctx.strokeStyle = 'rgba(255,255,255,.06)';
        ctx.lineWidth = 1;
        ctx.strokeRect(cx + 0.5, cy + 0.5, layout.cell - 1, layout.cell - 1);
        var tier = grid[y][x];
        if (!tier) continue;
        var pad = layout.cell * 0.1;
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(cx + pad, cy + pad, layout.cell - pad * 2, layout.cell - pad * 2, layout.cell * 0.16);
        else ctx.rect(cx + pad, cy + pad, layout.cell - pad * 2, layout.cell - pad * 2);
        ctx.fillStyle = TIERS[tier - 1].colour;
        ctx.fill();
        ctx.font = '900 ' + Math.round(layout.cell * 0.34) + 'px ui-monospace, monospace';
        ctx.fillStyle = tier >= 4 ? '#0b0d12' : '#08100f';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(String(1 << (tier - 1)), cx + layout.cell / 2, cy + layout.cell / 2);
      }
    }
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';

    pops.forEach(function (p) {
      ctx.globalAlpha = Math.max(0, p.a);
      ctx.beginPath();
      ctx.arc(layout.ox + p.x * layout.cell + layout.cell / 2, layout.oy + p.y * layout.cell + layout.cell / 2, layout.cell * 0.6 * (1.4 - p.a), 0, Math.PI * 2);
      ctx.strokeStyle = TIERS[Math.min(TIERS.length, p.tier) - 1].colour;
      ctx.lineWidth = 3;
      ctx.stroke();
    });
    ctx.globalAlpha = 1;

    // Heat bar down the side.
    var barH = layout.cell * ROWS;
    var barX = layout.ox + layout.cell * COLS + 18;
    ctx.fillStyle = 'rgba(255,255,255,.07)';
    ctx.fillRect(barX, layout.oy, 8, barH);
    ctx.fillStyle = heat > 75 ? '#ff7a7a' : heat > 45 ? '#fde68a' : '#6ee7b7';
    ctx.fillRect(barX, layout.oy + barH * (1 - heat / 100), 8, barH * (heat / 100));
  }

  var runner = GGA.loop(update, draw);
  function begin() {
    reset();
    state = 'play';
    intro.hidden = true;
    over.hidden = true;
    runner.start();
  }
  document.getElementById('go').addEventListener('click', begin);
  document.getElementById('again').addEventListener('click', begin);
  reset();
  draw();
  runner.start();
})();
</script>
</body>
</html>
