<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Hole.io — Playable (Unblocked)</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#0b0d12;color:#f4f2ec;font-family:system-ui,Segoe UI,Arial}*{box-sizing:border-box}#bar{position:absolute;top:0;left:0;right:0;height:38px;display:flex;align-items:center;gap:6;padding:0 8px;background:rgba(11,13,18,.96);border-bottom:1px solid rgba(255,255,255,.08);z-index:20;font-size:11px;font-weight:900;letter-spacing:.04em}#bar small{opacity:.55;font-weight:600}#bar select{margin-left:8px;padding:5px 8px;border-radius:99px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.08);color:#fff;font-size:11px;font-weight:800}#bar button{padding:6px 10px;border-radius:99px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.08);color:#fff;font-size:11px;font-weight:900;cursor:pointer}#bar button.primary{background:#d7f34a;color:#111;border-color:#d7f34a}#frame{position:absolute;inset:38px 0 0 0;border:0;width:100%;height:calc(100% - 38px);background:#000}#loader{position:absolute;inset:38px 0 0 0;display:grid;place-items:center;background:#0b0d12;z-index:10;text-align:center;padding:20px}#loader.hidden{display:none}.spin{width:36px;height:36px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:#d7f34a;animation:spin .8s linear infinite;margin:0 auto 12px}@keyframes spin{to{transform:rotate(360deg)}}#err{display:none;margin-top:12px;padding:10px 14px;border-radius:10px;background:rgba(255,190,70,.12);border:1px solid rgba(255,190,70,.25);font-size:12px;max-width:560px;text-align:left}#err b{color:#ffbe46}#mirrorRow{display:flex;gap:6;justify-content:center;flex-wrap:wrap;margin-top:10px}</style><script src="/uv/uv.bundle.js"></script><script src="/uv/uv.config.js"></script></head><body>
<div id="bar"><span>HOLE.IO</span><small>• official playable • no download</small>
<select id="mirrorSel" title="Switch mirror"></select>
<button id="retryBtn">Retry</button><button id="fs">Fullscreen</button><button id="localBtn" style="background:rgba(215,243,74,.18);border-color:rgba(215,243,74,.3)">Local ★</button></div>
<div id="loader"><div><div class="spin"></div><div style="font-weight:900;letter-spacing:.04em" id="statusTxt">CONNECTING — HOLE.IO — PLAYABLE</div><div style="opacity:.6;font-size:12px;margin-top:4px" id="subTxt">Official Voodoo build via playable mirror • same-origin /service/ — not the download page</div><div id="err"></div><div id="mirrorRow"></div><div style="margin-top:12px;display:flex;gap:8;justify-content:center;flex-wrap:wrap"><a href="/games/hole-io/index.html" style="padding:8px 14px;border-radius:99px;background:#d7f34a;color:#111;font-weight:900;text-decoration:none;font-size:12px">Play Local Lounge Edition ★</a><a href="/proxy" style="padding:8px 14px;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#fff;text-decoration:none;font-size:12px">Open via Proxy</a></div></div></div>
<iframe id="frame" allow="fullscreen; autoplay; clipboard-read; clipboard-write; encrypted-media; picture-in-picture; web-share; gamepad" allowfullscreen></iframe>
<script>
(function(){
  // hole-io.com now redirects to voodoo.io download page — not playable. Use real playable mirrors that embed the Unity WebGL build.
  var MIRRORS = [
    {id:'local', label:'Local ★ instant', url:'/games/hole-io/index.html', local:true},
    {id:'holeonline', label:'HoleOnline ★', url:'https://holeonline.io/'},
    {id:'twoplayer', label:'TwoPlayerGames', url:'https://www.twoplayergames.org/game/hole-io'},
    {id:'kevin', label:'Kevin.Games', url:'https://kevin.games/hole-io'},
    {id:'playhole', label:'PlayHole', url:'https://playhole.io/'},
    {id:'hole-io-com', label:'Hole-io.com', url:'https://hole-io.com'},
  ];
  var frame=document.getElementById('frame');
  var loader=document.getElementById('loader');
  var errEl=document.getElementById('err');
  var sel=document.getElementById('mirrorSel');
  var statusTxt=document.getElementById('statusTxt');
  var subTxt=document.getElementById('subTxt');
  var mirrorRow=document.getElementById('mirrorRow');
  var PUBLIC_BARES=['https://tomphttp.outv1.workers.dev/','https://bare.noblocc.uk/','https://bare.undercover.goatse.cx/','https://bare.zorip.eu.org/','https://bare.holy.how/','https://tomphttp-2x.ayayay.workers.dev/'];
  function getBare(){try{var v=localStorage.getItem('gg_bare');if(v) return v;}catch(e){} try{var m=document.cookie.match(/(?:^|; )gg_bare=([^;]*)/);if(m) return decodeURIComponent(m[1]);}catch(e){} return '/api/bare/';}
  function setBare(b){try{localStorage.setItem('gg_bare',b);}catch(e){} try{document.cookie='gg_bare='+encodeURIComponent(b)+'; path=/; max-age=86400; samesite=lax';}catch(e){} try{if(self.__uv$config) self.__uv$config.bare=b.endsWith('/')?b:b+'/';}catch(e){}}
  async function probeBare(u){try{var r=await fetch(u,{cache:'no-store',signal:AbortSignal.timeout(3500)});return r.ok;}catch(e){return false;}}
  async function chooseBare(target){var cur=getBare(); try{if(await probeBare(cur)) return cur;}catch(e){} for(var i=0;i<PUBLIC_BARES.length;i++){var cand=PUBLIC_BARES[i];try{if(await probeBare(cand)){setBare(cand);return cand;}}catch(e){}} return cur;}
  function showErr(msg,bare){if(errEl){errEl.style.display='block';errEl.innerHTML='<b>'+(msg||'waiting')+'</b>'+(bare?'<br><span style="opacity:.7">bare: '+bare+'</span>':'')+'<br><span style="opacity:.6">hole-io.com now shows only a download page (Voodoo moved the browser build) — we use playable mirrors that still host the Unity build. Click Local for instant offline play.</span>';}}
  async function ensureSW(){
    if(!('serviceWorker' in navigator)) return false;
    if(navigator.serviceWorker.controller) return true;
    var cands=[{script:'/uv/uv.sw.js',scope:'/service/'},{script:'/uv/uv.sw.js',scope:'/'},{script:'/service/uv.sw.js',scope:'/service/'},{script:'/uv.sw.js',scope:'/'}];
    for(var i=0;i<cands.length;i++){var c=cands[i];try{var reg=await navigator.serviceWorker.register(c.script,{scope:c.scope,updateViaCache:'none'});try{await reg.update();}catch(e){} await Promise.race([navigator.serviceWorker.ready,new Promise(function(_,rej){setTimeout(function(){rej(new Error('ready timeout'))},2200)})]); if(navigator.serviceWorker.controller||(reg&&reg.active)) return true; await new Promise(function(r){setTimeout(r,300)}); if(navigator.serviceWorker.controller) return true;}catch(e){continue;}}
    return !!navigator.serviceWorker.controller;
  }
  function fillSel(activeIdx){
    sel.innerHTML=''; mirrorRow.innerHTML='';
    MIRRORS.forEach(function(m,i){
      var o=document.createElement('option'); o.value=i; o.textContent=m.label+(m.local?' • offline':''); if(i===activeIdx) o.selected=true; sel.appendChild(o);
      var b=document.createElement('button'); b.textContent=m.label; b.style.cssText='padding:6px 10px;border-radius:99px;border:1px solid rgba(255,255,255,.12);background:'+(i===activeIdx?'#d7f34a;color:#111':'rgba(255,255,255,.08);color:#fff')+';font-size:11px;font-weight:800;cursor:pointer';
      b.onclick=function(){ curIdx=i; boot(true); }; mirrorRow.appendChild(b);
    });
  }
  var curIdx=0; var tries=0; var booted=false; var bootTimer=null;
  async function boot(forceSwitch){
    if(bootTimer) clearTimeout(bootTimer);
    var m=MIRRORS[curIdx];
    fillSel(curIdx);
    statusTxt.textContent='CONNECTING — '+m.label.toUpperCase();
    subTxt.textContent='Target: '+m.url+ (m.local?' • local file (no proxy)': ' • via /service/ tunnel');
    errEl.style.display='none'; loader.classList.remove('hidden');
    tries++;
    try{
      if(m.local){
        frame.src=m.url;
        frame.onload=function(){ loader.classList.add('hidden'); };
        frame.onerror=function(){ showErr('Local failed — trying next mirror', ''); setTimeout(nextMirror,900); };
        booted=true; return;
      }
      if(!self.Ultraviolet||!self.__uv$config||!self.__uv$config.encodeUrl) throw new Error('uv not ready');
      var bare=await chooseBare(m.url); setBare(bare);
      var hasSW=false; try{hasSW=await ensureSW();}catch(e){}
      if(!hasSW && tries<4){ showErr('ServiceWorker warming… (attempt '+tries+')',bare); bootTimer=setTimeout(function(){boot();},700+tries*300); return; }
      var cfg=self.__uv$config; try{var fresh=await chooseBare(m.url); if(fresh) cfg.bare=fresh.endsWith('/')?fresh:fresh+'/';}catch(e){}
      var url=cfg.prefix+cfg.encodeUrl(m.url);
      frame.src=url;
      frame.onload=function(){
        // Hide download overlay, force game fill
        try{
          var doc=frame.contentDocument;
          if(doc){
            // remove “Download” heavy overlay if hole-io.com download page slipped through
            var st=doc.createElement('style');
            st.textContent='html,body{margin:0!important;background:#0b0d12!important}#gameContainer,#unityContainer,iframe,canvas{position:fixed!important;inset:38px 0 0 0!important;width:100%!important;height:calc(100% - 38px)!important;border:0!important}';
            doc.head&&doc.head.appendChild(st);
          }
        }catch(e){}
        clearTimeout(bootTimer);
        // Auto-detect download page vs playable
        bootTimer=setTimeout(function(){
          try{
            var d=frame.contentDocument;
            if(d){
              var txt=(d.body.innerText||'').toLowerCase();
              if(txt.includes('download') && txt.includes('app store') && (d.body.innerHTML.length<4000 || !d.querySelector('canvas, iframe'))){
                showErr('This mirror shows only the download page (official browser build moved) — switching to next playable mirror', bare);
                nextMirror();
                return;
              }
              if(!d.body || d.body.innerHTML.length<600){
                showErr('This mirror returned empty — trying next', bare);
                nextMirror();
              } else {
                loader.classList.add('hidden');
              }
            } else {
              loader.classList.add('hidden');
            }
          }catch(e){ loader.classList.add('hidden'); }
        },3800);
      };
      frame.onerror=function(){ showErr('Frame error on '+m.label+' — trying next', bare); nextMirror(); };
      booted=true;
    }catch(e){ showErr((e&&e.message)||String(e), getBare()); bootTimer=setTimeout(boot,900+tries*250); }
  }
  function nextMirror(){ curIdx=(curIdx+1)%MIRRORS.length; if(curIdx===0) tries=0; boot(true); }
  document.getElementById('retryBtn').onclick=function(){ boot(true); };
  sel.onchange=function(){ curIdx=parseInt(sel.value,10)||0; boot(true); };
  document.getElementById('localBtn').onclick=function(){ curIdx=MIRRORS.findIndex(function(m){return m.local;}); boot(true); };
  document.getElementById('fs').onclick=function(){try{if(frame.requestFullscreen) frame.requestFullscreen();}catch(e){}};
  if(document.readyState==='complete') setTimeout(function(){boot();},80); else window.addEventListener('load', boot);
  setTimeout(boot,1400);
  setTimeout(function(){ if(!booted) boot(); },4200);
})();
</script></body></html>
